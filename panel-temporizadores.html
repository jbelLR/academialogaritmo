<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de tiempos · Academia logaRitmo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0f3a4d; --teal2:#0c2e3d; --gold:#e9a93a; --gold-soft:#f3c876;
    --tx:#eaf2f5; --mut:#9fb6c0; --run:#e9a93a; --warn:#f5c542; --done:#ff6b5e;
    --edge:rgba(233,169,58,.25);
    --mono:'SF Mono','Roboto Mono','Menlo','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Montserrat',system-ui,sans-serif;font-weight:700;color:var(--tx);
    background:radial-gradient(120% 120% at 50% 0%, #14495f 0%, var(--teal) 55%, var(--teal2) 100%);
    min-height:100vh;padding:18px 22px 64px;
  }
  /* logo de la academia como marca de agua de fondo */
  .watermark{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:0;pointer-events:none}
  .watermark img{width:min(58vw,620px);opacity:.05}
  body>header, body>.grid, body>.empty{position:relative;z-index:1}

  header{
    max-width:1500px;margin:0 auto 18px;display:flex;align-items:center;
    justify-content:space-between;flex-wrap:wrap;gap:14px;
    border-bottom:1px solid var(--edge);padding-bottom:14px;
  }
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{height:52px;width:auto}
  .brand .t1{font-size:1.45rem;font-weight:900;letter-spacing:-.5px}
  .brand .t2{font-size:.8rem;color:var(--gold-soft);font-weight:700;letter-spacing:2px;text-transform:uppercase}
  .meta{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .clock{font-family:var(--mono);font-size:1.9rem;font-weight:700;color:var(--gold-soft);font-variant-numeric:tabular-nums}
  .count{font-size:.85rem;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:1.5px}
  .count b{color:var(--tx);font-size:1.25rem}
  #conn{font-size:.7rem;color:var(--mut);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:6px}
  #conn .dot{width:9px;height:9px;border-radius:50%;background:var(--run)}
  #conn.bad .dot{background:var(--done)}
  #conn.bad{color:var(--done)}
  #sound{
    background:transparent;border:1px solid var(--edge);color:var(--gold-soft);
    font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:1px;
    padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:700;
  }
  #sound.off{color:var(--mut)}

  /* Rejilla: hasta 16 (4x4) en pantalla grande */
  .grid{
    max-width:1500px;margin:0 auto;display:grid;
    grid-template-columns:repeat(4,1fr);gap:22px;align-items:center;justify-items:center;
  }
  @media (max-width:1100px){ .grid{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:760px){ .grid{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:460px){ .grid{grid-template-columns:1fr} }

  /* Temporizador redondo */
  .card{
    position:relative;width:100%;max-width:300px;aspect-ratio:1/1;
    display:flex;align-items:center;justify-content:center;
  }
  .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .ring .track{fill:none;stroke:rgba(233,169,58,.16);stroke-width:6}
  .ring .prog{
    fill:none;stroke:var(--run);stroke-width:6;stroke-linecap:round;
    stroke-dasharray:276.46;stroke-dashoffset:0;
    transition:stroke-dashoffset .5s linear, stroke .3s;
  }
  .card .inner{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;padding:14% 16%;text-align:center;
  }
  .card .mesa{
    font-size:clamp(.95rem,1.5vw,1.25rem);font-weight:800;line-height:1.1;color:var(--tx);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .disp{
    font-family:var(--mono);font-size:clamp(1.9rem,3.6vw,2.9rem);font-weight:700;
    letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1;color:var(--gold-soft);
  }
  .card .tag{
    font-size:clamp(.58rem,.9vw,.7rem);text-transform:uppercase;letter-spacing:1.4px;font-weight:800;
    color:var(--gold-soft);opacity:.92;
  }
  /* estados */
  .card.run  .ring .prog{stroke:var(--gold)}
  .card.run  .disp{color:var(--gold-soft)}
  .card.warn .ring .prog{stroke:var(--warn)}
  .card.warn .disp{color:var(--warn)}
  .card.warn{animation:pulse 1.3s ease-in-out infinite}
  .card.warn .tag{color:var(--warn)}
  .card.done .ring .prog{stroke:var(--done)}
  .card.done .ring .track{stroke:rgba(255,107,94,.18)}
  .card.done .disp,.card.done .mesa{color:var(--done)}
  .card.done .tag{color:var(--done)}
  .card.done{animation:buzz .55s ease-in-out infinite}
  .card.libre .ring .prog{stroke:rgba(159,182,192,.45)}
  .card.libre .disp{color:var(--gold-soft)}
  .card.libre .tag{color:var(--mut)}
  @keyframes buzz{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  @keyframes pulse{0%,100%{filter:drop-shadow(0 0 0 rgba(245,197,66,0))}50%{filter:drop-shadow(0 0 10px rgba(245,197,66,.4))}}

  .empty{
    max-width:1100px;margin:7vh auto 0;text-align:center;color:var(--mut);
    display:flex;flex-direction:column;align-items:center;gap:18px;
  }
  .empty img{width:200px;max-width:60vw;opacity:.85}
  .empty .big{font-size:1.4rem;color:var(--gold-soft);font-weight:800}

  footer{
    position:fixed;left:0;right:0;bottom:0;padding:9px;text-align:center;
    font-size:.7rem;color:var(--mut);font-family:var(--mono);letter-spacing:1px;
    background:linear-gradient(0deg,rgba(12,46,61,.92),transparent);z-index:1;
  }
</style>
</head>
<body>
  <div class="watermark"><img src="logo.png" alt="" onerror="this.parentNode.style.display='none'"></div>

  <header>
    <div class="brand">
      <img src="logo.png" alt="Academia logaRitmo" onerror="this.style.display='none'">
      <div>
        <div class="t1">En clase ahora</div>
        <div class="t2">Panel de tiempos</div>
      </div>
    </div>
    <div class="meta">
      <div class="count"><b id="nActivos">0</b> en clase</div>
      <div class="clock" id="reloj">--:--</div>
      <button id="sound" class="">&#9834; Sonido</button>
      <div id="conn"><span class="dot"></span><span id="connTxt">Conectando&hellip;</span></div>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <div class="empty" id="empty" style="display:none">
    <img src="logo.png" alt="" onerror="this.style.display='none'">
    <div class="big">No hay nadie fichado ahora mismo</div>
    <div>Cuando un alumno fiche la entrada, su mesa aparecer&aacute; aqu&iacute; con la cuenta atr&aacute;s.</div>
  </div>

  <footer>Academia logaRitmo &middot; cada mesa con su tiempo &middot; suena al acabarse</footer>

<script>
/* ===================== CONFIG ===================== */
// Misma URL del backend que usa el scanner (la que acaba en CYA/exec).
var BACKEND_URL = "https://script.google.com/macros/s/AKfycbx0EYlUHXETDiZEL3lwaILCpAtNdeEgN_WcNJECTgrMKKwhnz4YuixssmHnGZZKvllwKg/exec";
var TOKEN       = "logaritmo2026";   // misma contrasena que el scanner
var POLL_MS     = 10000;             // cada cuanto pregunta al backend quien esta en clase
var AVISO_SEG   = 300;               // a partir de aqui (5 min) el circulo avisa en amarillo
var CIRC        = 276.46;            // circunferencia del anillo (2*PI*44)
/* ================================================== */

var DEMO = /[?&]demo=1/.test(location.search);  // abre con ?demo=1 para ver 16 de ejemplo sin backend

var grid = document.getElementById('grid');
var elEmpty = document.getElementById('empty');
var elReloj = document.getElementById('reloj');
var elN = document.getElementById('nActivos');
var conn = document.getElementById('conn');
var connTxt = document.getElementById('connTxt');

var soundOn = true;
var btnSound = document.getElementById('sound');
btnSound.addEventListener('click', function(){
  soundOn = !soundOn;
  btnSound.classList.toggle('off', !soundOn);
  btnSound.innerHTML = soundOn ? '♪ Sonido' : '♪ Silencio';
  if (soundOn) desbloquearAudio();
});

/* ---- audio (alarma sintetizada, sin archivos) ---- */
var audioCtx = null;
function desbloquearAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.resume) audioCtx.resume(); }catch(e){} }
function beep(){
  if(!soundOn) return;
  try{
    desbloquearAudio();
    var now = audioCtx.currentTime;
    [0,0.18,0.36].forEach(function(off,i){
      var osc=audioCtx.createOscillator(), g=audioCtx.createGain();
      osc.type='sine'; osc.frequency.value=880+i*110;
      g.gain.setValueAtTime(0,now+off);
      g.gain.linearRampToValueAtTime(0.3,now+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,now+off+0.16);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(now+off); osc.stop(now+off+0.16);
    });
  }catch(e){}
}
window.addEventListener('pointerdown', desbloquearAudio, {once:true});

/* ---- estado ----
   clave interna = ref (ID del alumno); NUNCA se muestra. Solo se ve la mesa. */
var sesiones = {};        // ref -> {mesa, entrada, prevista, totalSec, baseRem, baseEla, sync, done, mode, el}
var offsetMs = 0;         // (hora servidor - hora local) en ms
var ultimaOk = 0;

function hhmmToMin(s){ if(!s) return null; var p=String(s).split(':'); return (+p[0])*60+(+p[1]); }
function pad(n){ return (n<10?'0':'')+n; }
function fmt(sec){
  if(sec<0) sec=0; sec=Math.floor(sec);
  var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h>0 ? h+':'+pad(m)+':'+pad(s) : pad(m)+':'+pad(s);
}
function ahoraServidorMin(){
  var d=new Date(Date.now()+offsetMs);
  return d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
}

/* ---- crear / reconciliar tarjetas redondas ---- */
function card(ref){
  var c=document.createElement('div');
  c.className='card'; c.dataset.ref=ref;
  c.innerHTML =
    '<svg class="ring" viewBox="0 0 100 100">'+
      '<circle class="track" cx="50" cy="50" r="44"></circle>'+
      '<circle class="prog" cx="50" cy="50" r="44"></circle>'+
    '</svg>'+
    '<div class="inner"><div class="mesa"></div><div class="disp">--:--</div><div class="tag"></div></div>';
  grid.appendChild(c);
  return {root:c, prog:c.querySelector('.prog'), mesa:c.querySelector('.mesa'), disp:c.querySelector('.disp'), tag:c.querySelector('.tag')};
}

function aplicar(lista){
  var vistos={};
  lista.forEach(function(a){
    vistos[a.ref]=true;
    var s=sesiones[a.ref];
    if(!s){ s={el:card(a.ref)}; sesiones[a.ref]=s; }
    s.mesa = a.mesa || 'Sin mesa';
    s.entrada = a.entrada || '';
    s.prevista = a.prevista || '';
    s.mode = s.prevista ? 'countdown' : 'countup';
    var nowMin = ahoraServidorMin();
    if(s.mode==='countdown'){
      s.baseRem = (hhmmToMin(s.prevista) - nowMin)*60;
      var ent = hhmmToMin(s.entrada);
      var total = (ent!=null) ? (hhmmToMin(s.prevista) - ent)*60 : s.baseRem;
      s.totalSec = (total>0) ? total : Math.max(s.baseRem,1);
      if(s.done && s.baseRem>2) s.done=false; // le ampliaron o volvio a fichar
    } else {
      var ent2 = hhmmToMin(s.entrada);
      s.baseEla = (ent2!=null ? (nowMin - ent2)*60 : 0);
    }
    s.sync = performance.now();
  });
  // quitar los que ya no estan (han fichado salida)
  Object.keys(sesiones).forEach(function(ref){
    if(!vistos[ref]){ sesiones[ref].el.root.remove(); delete sesiones[ref]; }
  });
  var n=Object.keys(sesiones).length;
  elN.textContent=n;
  elEmpty.style.display = n? 'none':'flex';
  grid.style.display = n? 'grid':'none';
}

/* ---- tick local ---- */
function tick(){
  var d=new Date(Date.now()+offsetMs);
  elReloj.textContent = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());

  Object.keys(sesiones).forEach(function(ref){
    var s=sesiones[ref];
    var dt=(performance.now()-s.sync)/1000;
    s.el.mesa.textContent = s.mesa;
    if(s.mode==='countdown'){
      var rem = s.baseRem - dt;
      var frac = Math.max(0, Math.min(1, s.totalSec>0 ? rem/s.totalSec : 0));
      s.el.prog.style.strokeDashoffset = (CIRC*(1-frac)).toFixed(1);
      var cls='card run';
      if(rem<=0){
        cls='card done';
        s.el.disp.textContent='00:00';
        s.el.tag.textContent='¡Tiempo!';
        if(!s.done){ s.done=true; beep(); }
      } else if(rem<=AVISO_SEG){
        cls='card warn';
        s.el.disp.textContent=fmt(rem);
        s.el.tag.textContent='Hasta las '+s.prevista;
      } else {
        s.el.disp.textContent=fmt(rem);
        s.el.tag.textContent='Hasta las '+s.prevista;
      }
      s.el.root.className=cls;
    } else {
      var ela = s.baseEla + dt;
      s.el.prog.style.strokeDashoffset = '0';
      s.el.disp.textContent = fmt(ela);
      s.el.tag.textContent = 'Sin límite';
      s.el.root.className='card libre';
    }
  });
}

/* ---- traer sesiones activas (JSONP, igual que el scanner) ---- */
function poll(){
  if(DEMO){ demo(); marcarConn(true); return; }
  var cb='cbAct_'+Date.now();
  var s=document.createElement('script');
  var resuelto=false;
  window[cb]=function(res){
    resuelto=true;
    try{
      if(res && res.ahora){
        var sm=hhmmToMin(res.ahora)*60*1000;
        var now=new Date();
        var lm=now.getHours()*3600000+now.getMinutes()*60000+now.getSeconds()*1000;
        offsetMs = sm - lm;
      }
      aplicar((res && res.alumnos) ? res.alumnos : []);
      marcarConn(true);
    }catch(e){ marcarConn(false); }
    delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s);
  };
  s.onerror=function(){ if(resuelto)return; marcarConn(false); delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); };
  setTimeout(function(){ if(resuelto)return; marcarConn(false); try{delete window[cb];}catch(e){} if(s.parentNode) s.parentNode.removeChild(s); }, 9000);
  s.src = BACKEND_URL+'?action=activos&token='+encodeURIComponent(TOKEN)+'&callback='+cb+'&_='+Date.now();
  document.body.appendChild(s);
}

function marcarConn(ok){
  if(ok){ ultimaOk=Date.now(); conn.className=''; connTxt.textContent='En vivo'; }
  else{
    var secs=ultimaOk?Math.round((Date.now()-ultimaOk)/1000):'-';
    conn.className='bad'; connTxt.textContent='Sin conexion'+(ultimaOk?(' ('+secs+'s)'):'');
  }
}

/* ---- demo sin backend (?demo=1): 16 mesas de ejemplo ---- */
function demo(){
  var h=new Date(); var m=h.getHours()*60+h.getMinutes();
  function toHHMM(v){ v=((v%1440)+1440)%1440; return pad(Math.floor(v/60))+':'+pad(Math.floor(v%60)); }
  var mesas=['Pitagoras','Newton','Euler','Gauss','Curie','Tesla','Turing','Hipatia','Galois','Fermat','Ada','Riemann','Noether','Bohr','Fibonacci','Kepler'];
  offsetMs=0;
  var lista=mesas.map(function(nm,i){
    var dur=[30,60,90,120][i%4];
    var transcurrido=(i*7)%dur;
    var sinlimite=(i===15);
    return { ref:'A'+pad(i), mesa:'Mesa '+nm, entrada:toHHMM(m-transcurrido), prevista: sinlimite?'':toHHMM(m-transcurrido+dur) };
  });
  aplicar(lista);
}

/* ---- arranque ---- */
poll();
setInterval(poll, POLL_MS);
setInterval(tick, 250);
tick();
</script>
</body>
</html>
