<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de tiempos &middot; Academia logaRitmo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* unidad base: el panel se dibuja sobre un lienzo 16:9 de 100 x 56.25 unidades
       y esa unidad se encoge sola para caber SIEMPRE en la pantalla, sin scroll */
    --u: min(1vw, 1.7778vh);

    --teal:#0b2b39; --teal2:#05161f; --teal3:#123c50;
    --gold:#e9a93a; --gold2:#f7d79b;
    --edge:rgba(233,169,58,.20);
    --tx:#eef6f9; --mut:#7d99a6;
    --run:#e9a93a; --warn:#ffd24a; --done:#ff5f52; --free:#4fd6c6;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Montserrat',system-ui,-apple-system,sans-serif;
    font-weight:600;
    color:var(--tx);
    background:radial-gradient(125% 95% at 50% -14%, #17546e 0%, var(--teal) 46%, var(--teal2) 100%);
    /* texto nitido: sin esto Windows engorda y emborrona el claro sobre oscuro */
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    display:flex;align-items:center;justify-content:center;
  }

  .stage{
    position:relative;
    width:calc(var(--u)*100);
    height:calc(var(--u)*56.25);
    display:flex;flex-direction:column;
    padding:calc(var(--u)*1.8) calc(var(--u)*2.4);
  }
  /* reticula tenue de fondo, tipo sala de control */
  .stage::before{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(233,169,58,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(233,169,58,.05) 1px, transparent 1px);
    background-size:calc(var(--u)*4) calc(var(--u)*4);
    -webkit-mask-image:radial-gradient(78% 72% at 50% 44%, #000 0%, transparent 100%);
    mask-image:radial-gradient(78% 72% at 50% 44%, #000 0%, transparent 100%);
  }
  .stage>*{position:relative;z-index:1}

  /* ============ cabecera ============ */
  header{
    flex:0 0 auto;height:calc(var(--u)*8);
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;
    gap:calc(var(--u)*3);
    border-bottom:1px solid var(--edge);
  }
  .brand{display:flex;align-items:center;gap:calc(var(--u)*1.4)}
  .brand img{height:calc(var(--u)*5.2);width:auto}
  .brand .t1{font-size:calc(var(--u)*2.2);font-weight:800;letter-spacing:-.02em;line-height:1.05;white-space:nowrap}
  .brand .t2{
    font-size:calc(var(--u)*1.05);color:var(--gold);font-weight:600;
    letter-spacing:.22em;text-transform:uppercase;margin-top:calc(var(--u)*.35)
  }

  .clock{
    justify-self:center;
    font-size:calc(var(--u)*4.4);font-weight:700;color:var(--gold2);
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1;
  }

  .meta{display:flex;align-items:center;justify-content:flex-end;gap:calc(var(--u)*1.8)}
  .count{
    display:flex;align-items:baseline;gap:calc(var(--u)*.6);
    font-size:calc(var(--u)*1.05);color:var(--mut);font-weight:600;
    text-transform:uppercase;letter-spacing:.18em;
  }
  .count b{color:var(--tx);font-size:calc(var(--u)*2.6);font-weight:800;font-variant-numeric:tabular-nums}
  #sound{
    background:transparent;border:1px solid var(--edge);color:var(--gold2);
    font-family:inherit;font-size:calc(var(--u)*1);font-weight:700;
    text-transform:uppercase;letter-spacing:.14em;
    padding:calc(var(--u)*.7) calc(var(--u)*1.2);border-radius:calc(var(--u)*.7);cursor:pointer;
  }
  #sound.off{color:var(--mut);border-color:rgba(125,153,166,.3)}
  #conn{
    display:flex;align-items:center;gap:calc(var(--u)*.6);
    font-size:calc(var(--u)*1);color:var(--mut);font-weight:600;
    text-transform:uppercase;letter-spacing:.14em;
  }
  #conn .dot{
    width:calc(var(--u)*.85);height:calc(var(--u)*.85);border-radius:50%;background:var(--run);
    box-shadow:0 0 calc(var(--u)*.9) rgba(233,169,58,.8);
  }
  #conn.bad{color:var(--done)}
  #conn.bad .dot{background:var(--done);box-shadow:0 0 calc(var(--u)*.9) rgba(255,95,82,.8)}

  /* ============ zona principal ============ */
  main{
    flex:1 1 auto;min-height:0;
    display:grid;place-content:center;justify-items:center;align-items:center;
    gap:calc(var(--u)*2);
    margin:calc(var(--u)*1.4) 0;
  }

  .card{
    position:relative;width:var(--card);height:var(--card);
    display:flex;align-items:center;justify-content:center;
  }
  .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .ring .ticks{fill:none;stroke:rgba(233,169,58,.30);stroke-width:2.4;stroke-dasharray:.9 4.05}
  .ring .track{fill:none;stroke:rgba(233,169,58,.13);stroke-width:5}
  .ring .prog{
    fill:none;stroke:var(--run);stroke-width:5;stroke-linecap:round;
    stroke-dasharray:276.46;stroke-dashoffset:0;
    transition:stroke-dashoffset .45s linear, stroke .3s;
  }
  .card .inner{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:calc(var(--card)*.018);
    padding:14% 15%;text-align:center;
  }
  .card .mesa{
    font-size:calc(var(--card)*.095);font-weight:700;line-height:1.1;color:var(--tx);
    text-transform:uppercase;letter-spacing:.04em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .disp{
    font-size:calc(var(--card)*.255);font-weight:700;line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--gold2);
  }
  .card .tag{
    font-size:calc(var(--card)*.05);font-weight:600;text-transform:uppercase;
    letter-spacing:.16em;color:var(--gold);opacity:.9;
  }

  /* estados: el brillo va SOLO en el aro, nunca en los numeros */
  .card.run  .prog{stroke:url(#gRun); filter:drop-shadow(0 0 calc(var(--u)*.38) rgba(233,169,58,.32))}
  .card.warn .prog{stroke:url(#gWarn);filter:drop-shadow(0 0 calc(var(--u)*.8) rgba(255,210,74,.6))}
  .card.warn .disp,.card.warn .tag{color:var(--warn)}
  .card.warn{animation:pulse 1.4s ease-in-out infinite}
  .card.done .prog{stroke:url(#gDone);filter:drop-shadow(0 0 calc(var(--u)*.9) rgba(255,95,82,.65))}
  .card.done .track{stroke:rgba(255,95,82,.16)}
  .card.done .ticks{stroke:rgba(255,95,82,.32)}
  .card.done .disp,.card.done .mesa,.card.done .tag{color:var(--done)}
  .card.done{animation:buzz .6s ease-in-out infinite}
  .card.free .prog{stroke:rgba(79,214,198,.55)}
  .card.free .ticks{stroke:rgba(79,214,198,.28)}
  .card.free .disp{color:var(--free)}
  .card.free .tag{color:var(--free);opacity:.8}
  @keyframes buzz{0%,100%{transform:translateX(0)}25%{transform:translateX(-.35%)}75%{transform:translateX(.35%)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.88}}

  /* ============ ticker (banda rodante) ============ */
  .ticker{
    flex:0 0 auto;height:calc(var(--u)*11);position:relative;display:flex;align-items:stretch;
    border-top:1px solid var(--edge);
    background:linear-gradient(180deg, rgba(5,22,31,0), rgba(5,22,31,.6));
  }
  .ticker.hidden{display:none}
  .tk-badge{
    flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;
    padding:0 calc(var(--u)*1.8) 0 calc(var(--u)*.2);
    border-right:1px solid var(--edge);z-index:2;
    background:linear-gradient(90deg, var(--teal2) 62%, rgba(5,22,31,0));
  }
  .tk-badge .b1{
    font-size:calc(var(--u)*1.9);font-weight:800;color:var(--gold2);
    letter-spacing:.12em;text-transform:uppercase;line-height:1;
  }
  .tk-badge .b2{
    font-size:calc(var(--u)*.95);font-weight:600;color:var(--mut);
    letter-spacing:.2em;text-transform:uppercase;margin-top:calc(var(--u)*.35);
  }
  .tk-view{
    flex:1 1 auto;min-width:0;overflow:hidden;position:relative;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 calc(var(--u)*5), #000 calc(100% - var(--u)*8), transparent 100%);
    mask-image:linear-gradient(90deg, transparent 0, #000 calc(var(--u)*5), #000 calc(100% - var(--u)*8), transparent 100%);
  }
  .tk-lane{display:flex;height:100%;align-items:center;width:max-content;will-change:transform}
  .tk-lane.roll{animation:slide linear infinite}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .tk-run{display:flex;height:100%;align-items:center;flex:0 0 auto}

  .tk-item{
    position:relative;flex:0 0 auto;height:100%;
    display:flex;align-items:center;gap:calc(var(--u)*.9);
    padding:0 calc(var(--u)*1.6);
  }
  .tk-item::after{
    content:'';position:absolute;right:0;top:34%;height:32%;width:1px;
    background:linear-gradient(180deg,transparent,var(--edge),transparent);
  }
  .tk-name{
    font-size:calc(var(--u)*1.55);font-weight:700;color:var(--tx);
    text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;
  }
  .tk-time{
    font-size:calc(var(--u)*2.5);font-weight:700;color:var(--gold2);
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;
  }
  .tk-ar{font-size:calc(var(--u)*1.5);color:var(--gold);line-height:1}
  .tk-bar{
    position:absolute;left:calc(var(--u)*1.6);right:calc(var(--u)*1.6);
    bottom:calc(var(--u)*1.5);height:calc(var(--u)*.28);
    background:rgba(233,169,58,.14);border-radius:99px;overflow:hidden;
  }
  .tk-bar b{display:block;height:100%;width:100%;background:var(--gold);border-radius:99px;transition:width .45s linear}

  .tk-item.warn .tk-time,.tk-item.warn .tk-ar{color:var(--warn)}
  .tk-item.warn .tk-bar b{background:var(--warn)}
  .tk-item.done .tk-name,.tk-item.done .tk-time,.tk-item.done .tk-ar{color:var(--done)}
  .tk-item.done .tk-bar b{background:var(--done)}
  .tk-item.done .tk-time{animation:blink 1s steps(1,end) infinite}
  .tk-item.free .tk-time,.tk-item.free .tk-ar{color:var(--free)}
  .tk-item.free .tk-bar b{background:rgba(79,214,198,.5)}
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:.35}}

  /* ============ vacio ============ */
  .empty{
    position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:calc(var(--u)*2);text-align:center;z-index:2;
  }
  .empty.on{display:flex}
  .empty img{width:calc(var(--u)*16);opacity:.9}
  .empty .big{font-size:calc(var(--u)*3);font-weight:800;color:var(--gold2)}
  .empty .sub{font-size:calc(var(--u)*1.5);font-weight:500;color:var(--mut);max-width:calc(var(--u)*55)}
</style>
</head>
<body>

<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
  <linearGradient id="gRun"  x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d79b"/><stop offset="1" stop-color="#e9a93a"/></linearGradient>
  <linearGradient id="gWarn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a3"/><stop offset="1" stop-color="#ffc41f"/></linearGradient>
  <linearGradient id="gDone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a90"/><stop offset="1" stop-color="#ff4438"/></linearGradient>
</defs></svg>

<div class="stage">

  <header>
    <div class="brand">
      <img src="logo.png" alt="Academia logaRitmo" onerror="this.style.display='none'">
      <div>
        <div class="t1">En clase ahora</div>
        <div class="t2">Panel de tiempos</div>
      </div>
    </div>

    <div class="clock" id="reloj">--:--:--</div>

    <div class="meta">
      <div class="count"><b id="nActivos">0</b><span>en clase</span></div>
      <button id="sound">&#9834; Sonido</button>
      <div id="conn"><span class="dot"></span><span id="connTxt">Conectando&hellip;</span></div>
    </div>
  </header>

  <main id="main"></main>

  <div class="ticker hidden" id="ticker">
    <div class="tk-badge">
      <div class="b1">Aula</div>
      <div class="b2">En directo</div>
    </div>
    <div class="tk-view">
      <div class="tk-lane" id="tkLane"></div>
    </div>
  </div>

  <div class="empty" id="empty">
    <img src="logo.png" alt="" onerror="this.style.display='none'">
    <div class="big">No hay nadie fichado ahora mismo</div>
    <div class="sub">Cuando un alumno fiche la entrada, su mesa aparecer&aacute; aqu&iacute; con la cuenta atr&aacute;s.</div>
  </div>

</div>

<script>
/* ===================== CONFIG ===================== */
var BACKEND_URL = "https://script.google.com/macros/s/AKfycbzlgJydfgPZl75_d8KYJe1VC6KVYj9mTxme1i9hDrAtLyFHDjSUxkfWBw_K6VC4pCgBaw/exec";
var TOKEN       = "logaritmo2026";   // misma contrasena que el scanner
var POLL_MS     = 10000;             // cada cuanto pregunta al backend quien esta en clase
var AVISO_SEG   = 300;               // ultimos 5 min: el aro avisa en amarillo
var CIRC        = 276.46;            // circunferencia del aro (2*PI*44)
var FOCO_MAX    = 8;                 // hasta aqui, solo circulos grandes (sin banda)
var FOCO_N      = 4;                 // cuantas mesas se ven en grande cuando hay banda
var FOCO_DONE_MAX = 2;               // cuantas de esas cuatro pueden ser mesas ya acabadas
var TK_LAP      = 42;                // segundos que tarda la banda en dar una vuelta entera
var TK_VEL_MIN  = 110;               // limites de velocidad (px/s) para que siempre se lea
var TK_VEL_MAX  = 215;
/* ================================================== */

/* modo demo sin backend:  ?demo=24  (o ?demo=1 para las 16 de siempre) */
var mDemo  = location.search.match(/[?&]demo=(\d+)/);
var DEMO   = !!mDemo;
var DEMO_N = DEMO ? (+mDemo[1] === 1 ? 16 : Math.max(1, Math.min(60, +mDemo[1]))) : 0;

var elMain   = document.getElementById('main');
var elTicker = document.getElementById('ticker');
var elLane   = document.getElementById('tkLane');
var elEmpty  = document.getElementById('empty');
var elReloj  = document.getElementById('reloj');
var elN      = document.getElementById('nActivos');
var conn     = document.getElementById('conn');
var connTxt  = document.getElementById('connTxt');

/* ---- sonido (alarma sintetizada, sin archivos) ---- */
var soundOn = true;
var btnSound = document.getElementById('sound');
btnSound.addEventListener('click', function(){
  soundOn = !soundOn;
  btnSound.classList.toggle('off', !soundOn);
  btnSound.innerHTML = soundOn ? '♪ Sonido' : '♪ Silencio';
  if (soundOn) desbloquearAudio();
});
var audioCtx = null;
function desbloquearAudio(){
  try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
       if(audioCtx.resume) audioCtx.resume(); }catch(e){}
}
function beep(){
  if(!soundOn) return;
  try{
    desbloquearAudio();
    var now = audioCtx.currentTime;
    [0,0.18,0.36].forEach(function(off,i){
      var osc=audioCtx.createOscillator(), g=audioCtx.createGain();
      osc.type='sine'; osc.frequency.value=880+i*110;
      g.gain.setValueAtTime(0,now+off);
      g.gain.linearRampToValueAtTime(0.3,now+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,now+off+0.16);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(now+off); osc.stop(now+off+0.16);
    });
  }catch(e){}
}
window.addEventListener('pointerdown', desbloquearAudio, {once:true});

/* ---- estado ----
   la clave interna es la ref (ID del alumno) y NUNCA se muestra: solo se ve la mesa */
var sesiones = {};
var vista = { modo:null, sigCards:'', sigTk:'', cards:{}, tk:{} };
var ultimaOk = 0;

function pad(n){ return (n<10?'0':'')+n; }
function hhmmToTodayMs(hhmm){
  if(!hhmm) return null;
  var p=String(hhmm).split(':');
  var d=new Date(); d.setHours(+p[0]||0, +p[1]||0, 0, 0);
  return d.getTime();
}
function fmt(sec){
  if(sec<0) sec=0; sec=Math.floor(sec);
  var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h>0 ? h+':'+pad(m)+':'+pad(s) : pad(m)+':'+pad(s);
}
function estado(s, nowMs){
  if(s.mode!=='countdown') return {rem:null, frac:1, cls:'free'};
  var rem = (s.targetMs - nowMs)/1000;
  var frac = Math.max(0, Math.min(1, s.totalSec>0 ? rem/s.totalSec : 0));
  return {rem:rem, frac:frac, cls: rem<=0 ? 'done' : (rem<=AVISO_SEG ? 'warn' : 'run')};
}
/* orden de urgencia: primero quien menos tiempo le queda; los "sin limite", al final */
function porUrgencia(){
  var now = Date.now();
  return Object.keys(sesiones).sort(function(a,b){
    var ra = estado(sesiones[a], now).rem, rb = estado(sesiones[b], now).rem;
    if(ra===null) ra = Infinity;
    if(rb===null) rb = Infinity;
    return ra - rb;
  });
}
/* en la banda el espacio manda: "Mesa Newton" -> "NEWTON", pero "Mesa 7" se queda entero */
function mesaCorta(m){
  var s = String(m||'').trim();
  var r = s.replace(/^mesa\s+/i,'');
  return (/^\d+$/.test(r) || r.length<=2) ? s.toUpperCase() : r;
}
/* orden estable para la banda: alfabetico por mesa, asi no baila al pasar */
function porMesa(){
  return Object.keys(sesiones).sort(function(a,b){
    return String(sesiones[a].mesa).localeCompare(String(sesiones[b].mesa), 'es');
  });
}

/* ---- datos del backend ---- */
function aplicar(lista){
  var vistos = {};
  lista.forEach(function(a){
    vistos[a.ref] = true;
    var s = sesiones[a.ref] || (sesiones[a.ref] = {});
    s.mesa     = a.mesa || 'Sin mesa';
    s.entrada  = a.entrada || '';
    s.prevista = a.prevista || '';
    s.mode     = s.prevista ? 'countdown' : 'countup';
    if(s.mode==='countdown'){
      s.targetMs = hhmmToTodayMs(s.prevista);
      var entMs  = hhmmToTodayMs(s.entrada);
      var total  = (entMs!=null) ? (s.targetMs - entMs)/1000 : null;
      s.totalSec = (total && total>0) ? total : Math.max((s.targetMs-Date.now())/1000, 1);
    }else{
      s.startMs = hhmmToTodayMs(s.entrada) || Date.now();
    }
  });
  Object.keys(sesiones).forEach(function(ref){ if(!vistos[ref]) delete sesiones[ref]; });
  render();
}

/* ---- construccion de la vista ---- */
function makeCard(){
  var c = document.createElement('div');
  c.className = 'card';
  c.innerHTML =
    '<svg class="ring" viewBox="0 0 100 100">'+
      '<circle class="ticks" cx="50" cy="50" r="47.2"></circle>'+
      '<circle class="track" cx="50" cy="50" r="44"></circle>'+
      '<circle class="prog"  cx="50" cy="50" r="44"></circle>'+
    '</svg>'+
    '<div class="inner"><div class="mesa"></div><div class="disp">--:--</div><div class="tag"></div></div>';
  return {root:c, prog:c.querySelector('.prog'), mesa:c.querySelector('.mesa'),
          disp:c.querySelector('.disp'), tag:c.querySelector('.tag')};
}
function makeTkItem(){
  var d = document.createElement('div');
  d.className = 'tk-item';
  d.innerHTML = '<span class="tk-name"></span><span class="tk-time">--:--</span>'+
                '<span class="tk-ar">&#9662;</span><i class="tk-bar"><b></b></i>';
  return {root:d, name:d.querySelector('.tk-name'), time:d.querySelector('.tk-time'),
          ar:d.querySelector('.tk-ar'), bar:d.querySelector('.tk-bar b')};
}

/* cuantas columnas para n circulos cuando NO hay banda */
function columnas(n){
  if(n<=1) return 1;
  if(n<=2) return 2;
  if(n<=3) return 3;
  if(n<=4) return 2;
  if(n<=6) return 3;
  return 4;
}
/* mide el hueco real y calcula el lado del circulo: nunca se sale ni deja hueco de mas */
function medirCards(nCols, nRows){
  var uu  = Math.min(window.innerWidth/100, window.innerHeight/56.25); // la misma --u del CSS
  var gap = uu * 2;
  var W = elMain.clientWidth, H = elMain.clientHeight;
  var w = (W - (nCols-1)*gap) / nCols;
  var h = (H - (nRows-1)*gap) / nRows;
  var lado = Math.max(60, Math.min(w, h, uu*40));
  elMain.style.setProperty('--card', lado.toFixed(1)+'px');
}

function render(){
  var refs = Object.keys(sesiones);
  var n = refs.length;
  elN.textContent = n;
  elEmpty.classList.toggle('on', n===0);

  if(n===0){
    elMain.innerHTML=''; elLane.innerHTML='';
    elTicker.classList.add('hidden');
    vista = {modo:null, sigCards:'', sigTk:'', cards:{}, tk:{}};
    return;
  }

  var conBanda = n > FOCO_MAX;
  var urgentes = porUrgencia();
  var modo     = conBanda ? 'foco' : 'rejilla';
  var enFoco;
  if(!conBanda){
    enFoco = urgentes;
  }else{
    /* los acabados son lo mas urgente, pero no pueden acaparar el foco entero:
       si no, con varios sin recoger nadie ve quien esta a punto de terminar */
    var now = Date.now();
    var fin = [], vivos = [];
    urgentes.forEach(function(ref){
      (estado(sesiones[ref], now).cls==='done' ? fin : vivos).push(ref);
    });
    var huecosFin = Math.min(fin.length, FOCO_DONE_MAX);
    enFoco = fin.slice(0, huecosFin).concat(vivos.slice(0, FOCO_N - huecosFin));
  }

  /* --- circulos --- */
  var sigCards = modo + '|' + enFoco.join(',');
  if(sigCards !== vista.sigCards){
    vista.sigCards = sigCards;
    vista.cards = {};
    elMain.innerHTML = '';
    var cols = conBanda ? Math.min(FOCO_N, enFoco.length) : columnas(enFoco.length);
    var rows = Math.ceil(enFoco.length / cols);
    elMain.style.gridTemplateColumns = 'repeat('+cols+', auto)';
    enFoco.forEach(function(ref){
      var c = makeCard();
      elMain.appendChild(c.root);
      vista.cards[ref] = c;
    });
    medirCards(cols, rows);
    elMain.dataset.cols = cols; elMain.dataset.rows = rows;
  }

  /* --- banda rodante --- */
  if(!conBanda){
    if(vista.sigTk!==''){ elLane.innerHTML=''; vista.tk={}; vista.sigTk=''; }
    elTicker.classList.add('hidden');
    elLane.classList.remove('roll');
  }else{
    elTicker.classList.remove('hidden');
    var orden = porMesa();
    var sigTk = orden.join(',');
    if(sigTk !== vista.sigTk){
      vista.sigTk = sigTk;
      vista.tk = {};
      elLane.innerHTML = '';
      /* dos copias identicas: al desplazar el carril un 50% el bucle es invisible */
      for(var copia=0; copia<2; copia++){
        var run = document.createElement('div');
        run.className = 'tk-run';
        orden.forEach(function(ref){
          var it = makeTkItem();
          it.name.textContent = mesaCorta(sesiones[ref].mesa);
          run.appendChild(it.root);
          (vista.tk[ref] = vista.tk[ref] || []).push(it);
        });
        elLane.appendChild(run);
      }
      ajustarVelocidad();
    }
  }
  vista.modo = modo;
}

function ajustarVelocidad(){
  var run = elLane.firstChild;
  if(!run) return;
  var ancho = run.getBoundingClientRect().width;
  var hueco = elLane.parentNode.clientWidth;
  if(ancho <= hueco){          // cabe entero: no hace falta que ruede
    elLane.classList.remove('roll');
    elLane.style.animationDuration = '';
    elLane.style.transform = 'translateX(0)';
  }else{
    /* apunta a una vuelta de TK_LAP segundos, pero sin pasarse de rapido ni de lento */
    var vel = Math.max(TK_VEL_MIN, Math.min(TK_VEL_MAX, ancho / TK_LAP));
    elLane.style.transform = '';
    elLane.style.animationDuration = (ancho / vel).toFixed(1)+'s';
    elLane.classList.add('roll');
  }
}

/* ---- latido: actualiza textos, aros y barras ---- */
function tick(){
  var d = new Date();
  elReloj.textContent = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());

  var nowMs = Date.now();
  Object.keys(sesiones).forEach(function(ref){
    var s  = sesiones[ref];
    var st = estado(s, nowMs);
    var texto, etiqueta;

    if(st.cls==='free'){
      texto = fmt((nowMs - s.startMs)/1000);
      etiqueta = 'Sin límite';
    }else if(st.cls==='done'){
      texto = '00:00';
      etiqueta = '¡Tiempo!';
      if(!s.beeped){ s.beeped = true; beep(); }
    }else{
      texto = fmt(st.rem);
      etiqueta = 'Hasta las '+s.prevista;
      if(st.rem > 2) s.beeped = false;
    }

    var c = vista.cards[ref];
    if(c){
      c.root.className = 'card '+st.cls;
      c.mesa.textContent = mesaCorta(s.mesa);
      c.disp.textContent = texto;
      c.tag.textContent  = etiqueta;
      c.prog.style.strokeDashoffset = (CIRC*(1-st.frac)).toFixed(1);
    }
    var items = vista.tk[ref];
    if(items) items.forEach(function(it){
      it.root.className = 'tk-item '+st.cls;
      it.time.textContent = texto;
      it.ar.innerHTML = st.cls==='free' ? '&#9679;' : (st.cls==='done' ? '&#9632;' : '&#9662;');
      it.bar.style.width = (st.frac*100).toFixed(1)+'%';
    });
  });
}

/* ---- traer sesiones activas (JSONP, igual que el scanner) ---- */
function poll(){
  if(DEMO){ demo(); marcarConn(true); return; }
  var cb = 'cbAct_'+Date.now();
  var s  = document.createElement('script');
  var resuelto = false;
  window[cb] = function(res){
    resuelto = true;
    try{ aplicar((res && res.alumnos) ? res.alumnos : []); marcarConn(true); }
    catch(e){ marcarConn(false); }
    delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s);
  };
  s.onerror = function(){
    if(resuelto) return; marcarConn(false);
    delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s);
  };
  setTimeout(function(){
    if(resuelto) return; marcarConn(false);
    try{ delete window[cb]; }catch(e){}
    if(s.parentNode) s.parentNode.removeChild(s);
  }, 9000);
  s.src = BACKEND_URL+'?action=activos&token='+encodeURIComponent(TOKEN)+'&callback='+cb+'&_='+Date.now();
  document.body.appendChild(s);
}
function marcarConn(ok){
  if(ok){ ultimaOk = Date.now(); conn.className=''; connTxt.textContent='En vivo'; }
  else{
    var secs = ultimaOk ? Math.round((Date.now()-ultimaOk)/1000) : '-';
    conn.className = 'bad';
    connTxt.textContent = 'Sin conexión'+(ultimaOk ? (' ('+secs+'s)') : '');
  }
}

/* ---- demo sin backend:  ?demo=24  ---- */
var NOMBRES = ['Pitagoras','Newton','Euler','Gauss','Curie','Tesla','Turing','Hipatia',
               'Galois','Fermat','Ada','Riemann','Noether','Bohr','Fibonacci','Kepler',
               'Hilbert','Cantor','Descartes','Laplace','Poincare','Ramanujan','Lovelace','Germain',
               'Arquimedes','Leibniz','Cauchy','Abel','Bernoulli','Maxwell'];
function demo(){
  var h = new Date(), m = h.getHours()*60 + h.getMinutes();
  function toHHMM(v){ v=((v%1440)+1440)%1440; return pad(Math.floor(v/60))+':'+pad(Math.floor(v%60)); }
  var lista = [];
  for(var i=0;i<DEMO_N;i++){
    var dur = [30,60,90,120][i%4];
    /* reparto para que se vean los cuatro estados: uno acabado, un par avisando y el resto en marcha */
    var transcurrido = (i===1) ? dur+2 : (i===3 ? dur-3 : (i===6 ? dur-2 : (i*17)%Math.max(1,dur-8)));
    var sinLimite = (i>0 && i%9===0);
    lista.push({
      ref:'A'+pad(i),
      mesa:'Mesa '+NOMBRES[i%NOMBRES.length],
      entrada: toHHMM(m-transcurrido),
      prevista: sinLimite ? '' : toHHMM(m-transcurrido+dur)
    });
  }
  aplicar(lista);
}

/* ---- rehacer medidas al cambiar el tamano de la pantalla o al castear ---- */
var tRes;
window.addEventListener('resize', function(){
  clearTimeout(tRes);
  tRes = setTimeout(function(){
    if(elMain.dataset.cols) medirCards(+elMain.dataset.cols, +elMain.dataset.rows);
    ajustarVelocidad();
  }, 120);
});
/* cuando por fin carga Montserrat, los anchos cambian: recalcular la banda */
if(document.fonts && document.fonts.ready) document.fonts.ready.then(ajustarVelocidad);

/* ---- arranque ---- */
poll();
setInterval(poll, POLL_MS);
setInterval(tick, 250);
setInterval(render, 4000);   // reordena el foco cuando alguien acaba o llega
tick();
