<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F3A4D">
<title>Fichaje — Academia Logaritmo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0F3A4D;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#fff;user-select:none}
  /* cámara FRONTAL (29 sept 2026): se ve en espejo (.espejo), como un selfi, para que el
     alumno sepa hacia dónde mover el carné. El lector no se entera del espejo. */
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #cam.espejo{transform:scaleX(-1)}
  #velo{position:fixed;inset:0;background:linear-gradient(180deg,rgba(15,58,77,.55),rgba(15,58,77,.85))}

  .marco{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(62vw,62vh);aspect-ratio:1;border-radius:28px;
    box-shadow:0 0 0 9999px rgba(15,58,77,.55);border:3px solid rgba(255,255,255,.35)}
  .marco i{position:absolute;width:38px;height:38px;border:5px solid #E9A93A}
  .marco i:nth-child(1){top:-3px;left:-3px;border-right:0;border-bottom:0;border-radius:24px 0 0 0}
  .marco i:nth-child(2){top:-3px;right:-3px;border-left:0;border-bottom:0;border-radius:0 24px 0 0}
  .marco i:nth-child(3){bottom:-3px;left:-3px;border-right:0;border-top:0;border-radius:0 0 0 24px}
  .marco i:nth-child(4){bottom:-3px;right:-3px;border-left:0;border-top:0;border-radius:0 0 24px 0}

  #reposo{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;padding:5vh 4vw;pointer-events:none}
  #reposo h1{font-size:clamp(22px,4.4vw,44px);font-weight:800;letter-spacing:-.5px;text-align:center}
  #reposo p{font-size:clamp(15px,2.4vw,24px);opacity:.85;text-align:center;max-width:22ch}
  /* cabecera (29 sept 2026): logotipo + «Punto de fichaje» */
  .cabecera{display:flex;flex-direction:column;align-items:center;gap:.8vh;margin-top:-2vh}
  .cabecera img{height:clamp(40px,7vh,80px);width:auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,.35))}
  .cabecera span{font-size:clamp(11px,1.6vw,15px);font-weight:800;letter-spacing:.32em;text-transform:uppercase;
    color:#E9A93A;padding:4px 14px;border:1.5px solid rgba(233,169,58,.55);border-radius:99px;background:rgba(15,58,77,.55)}
  .pieReposo{display:flex;flex-direction:column;align-items:center;gap:.6vh}
  /* botón para cambiar de cámara: discreto, abajo a la derecha */
  #camBtn{position:fixed;right:2.5vw;bottom:3vh;z-index:4;font:inherit;font-size:clamp(13px,1.7vw,17px);font-weight:700;
    padding:10px 16px;min-width:0;border-radius:99px;border:1.5px solid rgba(255,255,255,.3);
    background:rgba(15,58,77,.7);color:#fff;cursor:pointer}
  .reloj{font-size:clamp(30px,6vw,64px);font-weight:800;color:#E9A93A;line-height:1}
  .fecha{font-size:clamp(13px,2vw,20px);opacity:.7;text-transform:capitalize}

  /* ---- pantallas de encima ---- */
  #panel{position:fixed;inset:0;background:#0F3A4D;display:none;
    flex-direction:column;align-items:center;justify-content:center;
    padding:6vh 6vw;text-align:center;gap:3vh;z-index:5}
  #panel.on{display:flex}
  #panel.verde{background:#0E4A3C}
  #panel.ambar{background:#5C420B}
  .icono{font-size:clamp(52px,11vw,104px);line-height:1}
  .titulo{font-size:clamp(28px,6.4vw,64px);font-weight:800;letter-spacing:-1px;line-height:1.05}
  .texto{font-size:clamp(17px,3.2vw,32px);line-height:1.4;max-width:26ch;opacity:.95}
  .pie{position:fixed;left:0;right:0;bottom:3vh;font-size:clamp(12px,1.8vw,18px);opacity:.5}

  .ops{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:1vh}
  button{font:inherit;font-weight:700;font-size:clamp(17px,3vw,28px);
    padding:18px 30px;min-width:150px;border:0;border-radius:18px;
    background:#E9A93A;color:#20160A;cursor:pointer}
  button.sec{background:rgba(255,255,255,.16);color:#fff}
  button:active{transform:scale(.97)}
  input[type=text]{font:inherit;font-size:clamp(18px,3vw,28px);padding:16px 20px;
    border-radius:16px;border:2px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.1);color:#fff;width:min(80vw,560px);text-align:center}
  .barra{height:7px;width:min(70vw,520px);border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
  .barra span{display:block;height:100%;width:100%;background:#E9A93A;transform-origin:left}
  .spin{width:54px;height:54px;border:6px solid rgba(255,255,255,.22);
    border-top-color:#E9A93A;border-radius:50%;animation:g .9s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  /* la mesa que le toca (29 sept 2026): lo más grande de la pantalla */
  .mesa{background:rgba(0,0,0,.22);border:3px solid #E9A93A;border-radius:24px;
    padding:2.2vh 5vw;line-height:1.05}
  .mesa small{display:block;font-size:clamp(15px,2.4vw,24px);font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:#E9A93A;margin-bottom:.6vh}
  .mesa b{display:block;font-size:clamp(40px,9vw,92px);font-weight:800;letter-spacing:-1px}
  .mesa i{font-style:normal;font-size:clamp(20px,3.6vw,38px);font-weight:700;opacity:.75}
  .sinmesa{background:#5C420B;border-radius:16px;padding:1.6vh 4vw;
    font-size:clamp(17px,3vw,28px);font-weight:700}
  /* plano del aula al lado: su mesa encendida y «AQUÍ». Se ajusta SIEMPRE al alto
     visible de la tablet (30 sept 2026: en la tablet no se veía la parte de abajo). */
  #panel{padding:3vh 3vw}
  .dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:3vw;align-items:center;width:100%;height:100%;min-height:0}
  .dos.elegir{grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr)}
  .izq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;min-width:0}
  .der{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;height:100%}
  .der svg{width:100%;height:100%;display:block}
  .dos .titulo{font-size:clamp(26px,4.6vw,56px)}
  .dos .texto{font-size:clamp(15px,2.3vw,26px)}
  .dos .mesa b{font-size:clamp(36px,6.4vw,80px)}
  @media (orientation:portrait){
    .dos,.dos.elegir{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:1.5vh}
    .izq{gap:1vh}
    .dos .icono{display:none}
  }
  /* «Pregunta 1 de 2» */
  .pasos{display:flex;align-items:center;gap:12px;font-size:clamp(13px,1.8vw,18px);font-weight:800;
    letter-spacing:.18em;text-transform:uppercase;color:#E9A93A}
  .pasos b{display:flex;gap:6px}
  .pasos i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25)}
  .pasos i.ahora{background:#E9A93A;box-shadow:0 0 10px rgba(233,169,58,.8)}
  .pasos i.hecho{background:#2e9e6a}
  .saludo{font-size:clamp(18px,2.8vw,28px);font-weight:700}
  .saludo span{display:block;font-size:.65em;font-weight:500;opacity:.75;margin-top:.3em}
  button.si{font-size:clamp(22px,3.8vw,38px);padding:.7em 1.6em;background:#2e9e6a;color:#fff}
  .horas button small{display:block;opacity:.65;font-weight:600;font-size:.6em}
  .pl{touch-action:manipulation}
  .pl text{font-size:14px;font-weight:900;text-anchor:middle;fill:#3a2206;letter-spacing:-.01em;pointer-events:none}
  .pl-otra rect{fill:rgba(5,22,36,.45)}
  .pl-suya rect{fill:#74efff;stroke:#e6ffff;stroke-width:3}
  .pl-suya text{fill:#042438}
  .pl-halo{fill:none!important;stroke:#5bf0ff!important;stroke-width:5;animation:latido 1.6s ease-in-out infinite}
  .pl-no rect{fill:rgba(5,22,36,.72)}
  .pl-no text{fill:rgba(255,255,255,.35);font-size:12px}
  .pl-pick{cursor:pointer}
  .pl-pick rect{fill:rgba(116,239,255,.18);stroke:#74efff;stroke-width:4;animation:brilla 1.4s ease-in-out infinite}
  .pl-pick.tocada rect{fill:#74efff}
  @keyframes brilla{50%{stroke-opacity:.35;fill:rgba(116,239,255,.05)}}
  @keyframes latido{50%{opacity:.35;stroke-width:9}}
  .pl-aqui{animation:bota 1.1s ease-in-out infinite}
  @keyframes bota{50%{transform:translateY(-6px)}}
  #aviso{position:fixed;top:0;left:0;right:0;background:#B3261E;color:#fff;
    padding:12px;text-align:center;font-size:15px;font-weight:700;display:none;z-index:9}
</style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>
<div id="velo"></div>
<div class="marco"><i></i><i></i><i></i><i></i></div>

<div id="reposo">
  <div class="cabecera">
    <img src="logo.png" alt="Academia Logaritmo" onerror="this.style.display='none'">
    <span>Punto de fichaje</span>
  </div>
  <div><h1>Acerca tu carné</h1><p>Ponlo dentro del recuadro. Se lee solo.</p></div>
  <div class="pieReposo"><div class="reloj" id="reloj">--:--</div><div class="fecha" id="fecha"></div></div>
</div>
<button id="camBtn" type="button" onclick="cambiarCamara()">📷 Cámara frontal</button>

<div id="panel"></div>
<div id="aviso"></div>

<script>
/* ─────────────────────────────────────────────────────────────
   CONFIGURACIÓN — lo único que hay que tocar
   Pega aquí la URL /exec de la aplicación web del FICHAJE.
   (Apps Script → Implementar → Nueva implementación → Aplicación web,
    ejecutar como TÚ, con acceso "Cualquier persona".)
   29 sept 2026: al fichar la entrada enseña en grande su mesa («Tu mesa: Newton · M11»).
   30 sept 2026: la mesa la ELIGE el alumno pulsando su silla en el plano del aula.
   ───────────────────────────────────────────────────────────── */
const API = 'https://script.google.com/macros/s/AKfycbxLbfrRn5U4dxrv2pc7D8tM6a09sK4Fg2ZDy8aKWwmiQUJCfLwIG29anCY22S8HDEMG/exec';

const CIERRE       = '20:30'; // la academia cierra a esta hora: ninguna opción pasa de aquí
const ESPERA_FINAL = 10;   // segundos que se queda el mensaje antes de volver a la cámara
const RELECTURA    = 4000; // ms de bloqueo tras leer, para no leer dos veces

/* ───────────────────────── estado ───────────────────────── */
const $ = s => document.querySelector(s);
const panel = $('#panel'), reposo = $('#reposo'), aviso = $('#aviso');
let ocupado = false, ultimo = '', ultimoT = 0, temporizador = null;
let planoActual = '';   // el plano con su mesa: acompaña a todas las pantallas de la entrada

/* ───────────────────────── reloj ───────────────────────── */
function reloj(){
  const d = new Date();
  $('#reloj').textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  $('#fecha').textContent = d.toLocaleDateString('es-ES',
    {weekday:'long', day:'numeric', month:'long'});
}
reloj(); setInterval(reloj, 10000);

/* ─────────────── que la tablet no se apague ─────────────── */
let wl = null;
async function despierta(){
  try { if ('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); } catch(e){}
}
despierta();
document.addEventListener('visibilitychange', () => { if (!document.hidden) despierta(); });

/* ───────────────────────── pantallas ───────────────────────── */
function mostrar(html, clase){
  panel.className = 'on' + (clase ? ' ' + clase : '');
  panel.innerHTML = planoActual
    ? '<div class="dos"><div class="izq">' + html + '</div><div class="der">' + planoActual + '</div></div>'
    : html;
}
function ocultar(){
  panel.className = '';
  panel.innerHTML = '';
  planoActual = '';
  ocupado = false;
}

/* ─────────────── el plano del aula (30 sept 2026) ───────────────
   La imagen del aula que eligió Javier (vista desde arriba, pizarra arriba).
   Al fichar la entrada, el alumno PULSA SU SILLA: solo se pueden pulsar las libres
   de su zona. Después, el plano con «AQUÍ» le acompaña hasta que se sienta.
   No sirve para nada más.
   SILLA = rectángulo de cada mesa sobre la imagen (776 × 1040), por su número.
   Si una mesa cambia de sitio en el aula, hay que cambiar la imagen y esta lista.
   Los nombres NO van aquí: llegan de la pestaña «Mesas» con cada fichaje. */

/* Pinta el aula. modo 'aqui': su mesa encendida + «AQUÍ». modo 'elegir': las libres de su zona brillan. */
function planoAula(modo, mesas, opc){
  opc = opc || {};
  const info = {};
  (mesas || []).forEach(m => { info[m[0]] = {nombre:m[1], zona:m[2], libre:m[3], puede:m[4]}; });
  let capas = '', marca = '';
  Object.keys(SILLA).forEach(k => {
    const n = +k, r = SILLA[k], x = r[0], y = r[1], w = r[2]-r[0], h = r[3]-r[1];
    const im = info[n] || {nombre:'M'+n, zona:'', libre:0};
    const nom = String(n === (opc.suya && opc.suya.n) ? opc.suya.nombre : im.nombre);
    const partes = nom.split(' ');
    const lin = partes.length > 1 ? [partes.slice(0,-1).join(' '), partes[partes.length-1]] : [nom];
    const cx = x + w/2, cy = y + h/2;
    const txt = lin.map((t,i) => '<text x="' + cx + '" y="' + (cy + (lin.length>1 ? -3 + i*15 : 5)) + '"' +
                 (t.length > 8 ? ' textLength="' + (w-8) + '" lengthAdjust="spacingAndGlyphs"' : '') + '>' + escapar(t) + '</text>').join('');
    if (modo === 'elegir'){
      const puede = im.libre && im.puede;   // el Codigo.gs decide (días de letras, reserva…)
      capas += puede
        ? '<g class="pl-pick" data-n="' + n + '"><rect x="' + (x-4) + '" y="' + (y-4) + '" width="' + (w+8) + '" height="' + (h+8) + '" rx="8"/>' + txt + '</g>'
        : '<g class="pl-no"><rect x="' + (x-3) + '" y="' + (y-3) + '" width="' + (w+6) + '" height="' + (h+6) + '" rx="6"/>' + txt + '</g>';
    } else {
      const es = opc.suya && n === opc.suya.n;
      capas += es
        ? '<g class="pl-suya"><rect class="pl-halo" x="' + (x-7) + '" y="' + (y-7) + '" width="' + (w+14) + '" height="' + (h+14) + '" rx="10"/>' +
          '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="6"/>' + txt + '</g>'
        : '<g class="pl-otra"><rect x="' + (x-3) + '" y="' + (y-3) + '" width="' + (w+6) + '" height="' + (h+6) + '" rx="6"/></g>';
      if (es) marca = '<g transform="translate(' + cx + ' ' + (y - 10) + ')"><g class="pl-aqui">' +
          '<rect x="-52" y="-58" width="104" height="40" rx="20" fill="#68eeff"/>' +
          '<text y="-31" text-anchor="middle" font-size="21" font-weight="900" letter-spacing="3" fill="#052838">AQUÍ</text>' +
          '<path d="M-12 -19 0 -3 12 -19" fill="#7cf3ff"/></g></g>';
    }
  });
  return '<svg class="pl" viewBox="0 0 776 1040" role="img" aria-label="Plano del aula">' +
         '<image href="' + AULA_IMG + '" width="776" height="1040"/>' + capas + marca + '</svg>';
}
function planoSVG(suya, mesas){ return planoAula('aqui', mesas, {suya: suya}); }

function pantallaLeyendo(){
  mostrar('<div class="spin"></div>' +
          '<div class="titulo">Carné leído</div>' +
          '<div class="texto">Ya puedes retirar el móvil. Un momento…</div>');
}

function pantallaError(msg){
  mostrar('<div class="icono">😕</div>' +
          '<div class="titulo">Vaya</div>' +
          '<div class="texto">' + msg + '</div>' +
          '<div class="ops"><button onclick="ocultar()">Volver</button></div>', 'ambar');
  setTimeout(() => { if (panel.className.includes('on')) ocultar(); }, 8000);
}

/* «Tu mesa: Newton (M11)» en grande. Si no quedaba ninguna libre, el aviso. */
function htmlMesa(r){
  if (r && r.mesa && r.mesa.nombre){
    return '<div class="mesa"><small>Tu mesa</small><b>' + escapar(r.mesa.nombre) + '</b>' +
           '<i>M' + escapar(r.mesa.n) + '</i></div>';
  }
  if (r && r.mesaAviso) return '<div class="sinmesa">⚠️ ' + escapar(r.mesaAviso) + '</div>';
  return '';
}

/** Pantalla final: se queda un buen rato y vuelve sola a la cámara. */
function pantallaFinal(icono, titulo, texto, clase, segundos, mesa){
  const s = segundos || ESPERA_FINAL;
  mostrar('<div class="icono">' + icono + '</div>' +
          '<div class="titulo">' + titulo + '</div>' +
          (mesa || '') +
          '<div class="texto">' + texto + '</div>' +
          '<div class="barra"><span id="bar"></span></div>' +
          '<div class="ops"><button class="sec" onclick="ocultar()">Listo</button></div>', clase);
  const bar = $('#bar');
  if (bar){
    bar.animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}],
                {duration: s*1000, fill:'forwards', easing:'linear'});
  }
  clearTimeout(temporizador);
  temporizador = setTimeout(ocultar, s*1000);
}

/* ═════════════════════════ EL FLUJO (30 sept 2026) ═════════════════════════
   Tres pasos y nada más (Javier):
     1. acerca el móvil
     2. PREGUNTA 1 de 2 — ¿hasta qué hora te quedas?  (confirmar la suya o tocar otra)
     3. PREGUNTA 2 de 2 — elige tu mesa               (pulsar una silla que brille)
   y una pantalla final: «Tu mesa: X» con el AQUÍ, que vuelve sola a la cámara.
   Si Javier ha puesto una pregunta en la pestaña «Preguntas», va como una más. */

const TIEMPO_HORA   = 30;   // s para contestar la hora; si no, «no lo sé»
const TIEMPO_ELEGIR = 45;   // s para elegir mesa; si no, una libre al azar

function htmlPaso(k, total){
  let puntos = '';
  for (let i = 1; i <= total; i++) puntos += '<i class="' + (i < k ? 'hecho' : i === k ? 'ahora' : '') + '"></i>';
  return '<div class="pasos"><span>Pregunta ' + k + ' de ' + total + '</span><b>' + puntos + '</b></div>';
}
function barraTiempo(seg){
  const bar = $('#bar');
  if (bar) bar.animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}],
                       {duration: seg*1000, fill:'forwards', easing:'linear'});
}

/* ── pregunta: la hora ── */
function preguntarSalida(r, corto, k, total, despues){
  clearTimeout(temporizador);
  planoActual = '';
  const prevista = r.prevista || '';
  const cierreMin = (function(){ const c=CIERRE.split(':'); return (+c[0])*60 + (+c[1]); })();
  const vistos = {};
  let confirmar = '';
  if (prevista){
    vistos[prevista] = 1;
    confirmar = '<button class="si" data-f="'+prevista+'">✓ Sí, hasta las '+prevista+'</button>';
  }
  const ahora = new Date();
  const opciones = [60, 90, 120, 180].map(m => {
    const d = new Date(ahora.getTime() + m*60000);
    let mins = d.getHours()*60 + d.getMinutes(), recortada = false;
    if (mins > cierreMin){ mins = cierreMin; recortada = true; }
    const hm = String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
    if (vistos[hm]) return '';
    vistos[hm] = 1;
    const et = recortada ? 'Hasta cerrar' : (m === 60 ? '1 hora' : m === 90 ? '1 h y media' : (m/60) + ' horas');
    return '<button data-f="'+hm+'">'+et+'<small>hasta '+hm+'</small></button>';
  }).join('');
  mostrar(htmlPaso(k, total) +
          '<div class="saludo">' + (corto ? '¡Hola, ' + escapar(corto) + '!' : '¡Hola!') +
            (r.texto ? ' <span>' + escapar(r.texto) + '</span>' : '') + '</div>' +
          '<div class="titulo">' + (prevista ? '¿Te quedas hasta las ' + prevista + '?' : '¿Hasta qué hora te quedas?') + '</div>' +
          (confirmar ? '<div class="ops">' + confirmar + '</div><div class="texto">Si no, toca otra:</div>' : '') +
          '<div class="ops horas">' + opciones + '<button class="sec" data-f="">No lo sé</button></div>' +
          '<div class="barra"><span id="bar"></span></div>', 'verde');
  barraTiempo(TIEMPO_HORA);
  let hecho = false;
  const fin = f => {
    if (hecho) return; hecho = true;
    clearTimeout(temporizador);
    if (f) llamar({accion:'salida', id:r.id, fin:f}).catch(()=>{});
    despues();
  };
  panel.querySelectorAll('button[data-f]').forEach(b => { b.onclick = () => fin(b.dataset.f); });
  temporizador = setTimeout(() => fin(''), TIEMPO_HORA*1000);
}

/* ── pregunta: la mesa ── */
function pantallaElegir(r, k, total, despues, aviso){
  clearTimeout(temporizador);
  planoActual = '';
  panel.className = 'on verde';
  panel.innerHTML = '<div class="dos elegir"><div class="izq">' +
      htmlPaso(k, total) +
      '<div class="titulo">Elige tu mesa</div>' +
      '<div class="texto">' + (aviso ? '⚠️ ' + escapar(aviso) : 'Toca una de las que <b>brillan</b>: están libres.') + '</div>' +
      '<div class="barra"><span id="bar"></span></div>' +
    '</div><div class="der">' + planoAula('elegir', r.mesas) + '</div></div>';
  barraTiempo(TIEMPO_ELEGIR);
  let hecho = false;
  const elegir = async (n) => {
    if (hecho) return; hecho = true;
    clearTimeout(temporizador);
    let res;
    try { res = await llamar({accion:'mesa', id:r.id, n:n}); } catch(e){ res = null; }
    if (res && res.ok && res.mesa){ r.mesa = res.mesa; despues(); }
    else if (res && res.ocupada){
      if (res.mesas) r.mesas = res.mesas;
      pantallaElegir(r, k, total, despues, res.texto);      // otro la ha cogido: que elija otra
    } else {
      r.mesaAviso = (res && res.error) || 'No he podido apuntar la mesa. Díselo a Javier.';
      despues();
    }
  };
  panel.querySelectorAll('.pl-pick').forEach(g => {
    g.addEventListener('click', () => { g.classList.add('tocada'); elegir(+g.dataset.n); });
  });
  temporizador = setTimeout(() => elegir(0), TIEMPO_ELEGIR*1000);
}

/* ── pregunta de Javier (pestaña «Preguntas»), si la hay ── */
function preguntar(r, k, total, despues){
  clearTimeout(temporizador);
  planoActual = '';
  const preg = r.pregunta;
  let ops = '';
  if (preg.opciones && preg.opciones.length){
    ops = '<div class="ops">' + preg.opciones.map((o,i) => '<button data-r="'+i+'">'+escapar(o)+'</button>').join('') + '</div>';
  } else {
    ops = '<input type="text" id="libre" autocomplete="off" placeholder="Escribe aquí…">' +
          '<div class="ops"><button data-r="libre">Enviar</button></div>';
  }
  mostrar(htmlPaso(k, total) + '<div class="titulo">' + escapar(preg.texto) + '</div>' + ops +
          '<div class="ops"><button class="sec" data-r="salta">Ahora no</button></div>', 'verde');
  panel.querySelectorAll('button[data-r]').forEach(b => {
    b.onclick = () => {
      const v = b.dataset.r;
      let resp = null;
      if (v === 'libre') resp = ($('#libre') || {}).value || '';
      else if (v !== 'salta') resp = preg.opciones[Number(v)];
      if (resp !== null && String(resp).trim())
        llamar({accion:'responder', id:r.id, pregunta:preg.texto, respuesta:resp}).catch(()=>{});
      despues();
    };
  });
}

/* ── final: su mesa con el AQUÍ, y a sentarse ── */
function pantallaListo(r, corto){
  planoActual = (r.mesa && SILLA[r.mesa.n]) ? planoSVG(r.mesa, r.mesas) : '';
  pantallaFinal('✅', corto ? '¡Listo, ' + escapar(corto) + '!' : '¡Listo!',
    r.arranque ? 'Tienes <b>' + (r.margen || 5) + ' minutos</b> para sacar el material. La clase empieza a las <b>' + escapar(r.arranque) + '</b>.'
               : 'Fichado a las ' + horaActual() + '. Buena clase 💪',
    'verde', 12, htmlMesa(r));
}

async function fichar(codigo){
  ocupado = true;
  planoActual = '';
  pantallaLeyendo();
  let r;
  try {
    r = await llamar({accion:'fichar', id:codigo});
  } catch(e){
    pantallaError('No hay conexión con la hoja. Díselo a Javier.');
    return;
  }
  if (!r || !r.ok){ pantallaError((r && r.error) || 'Algo ha fallado.'); return; }

  if (r.tipo === 'repetido'){
    planoActual = (r.mesa && SILLA[r.mesa.n]) ? planoSVG(r.mesa, r.mesas) : '';
    pantallaFinal('👍', r.titulo, r.texto, 'verde', r.espera, htmlMesa(r)); return;
  }
  if (r.tipo === 'salida'){
    pantallaFinal('👋', r.titulo, r.texto, 'verde', r.espera); return;
  }

  // ENTRADA: hora → (mesa) → (pregunta de Javier) → listo
  const corto = (r.nombre || '').trim().split(/\s+/)[0] || '';
  const total = 1 + (r.elegir ? 1 : 0) + (r.pregunta ? 1 : 0);
  let k = 0;
  const listo      = () => pantallaListo(r, corto);
  const conPregunta = () => r.pregunta ? preguntar(r, ++k, total, listo) : listo();
  const conMesa     = () => r.elegir ? pantallaElegir(r, ++k, total, conPregunta) : conPregunta();
  preguntarSalida(r, corto, ++k, total, conMesa);
}

function horaActual(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function escapar(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ───────────────────────── hablar con Apps Script ───────────────────────── */
function llamar(params){
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    const script = document.createElement('script');
    let terminado = false;
    const limpiar = () => {
      try { delete window[cb]; } catch(e) {}
      if (script.parentNode) script.parentNode.removeChild(script);
    };
    window[cb] = respuesta => {
      if (terminado) return;
      terminado = true;
      limpiar();
      resolve(respuesta);
    };
    script.onerror = () => {
      if (terminado) return;
      terminado = true;
      limpiar();
      reject(new Error('Sin conexión'));
    };
    const datos = Object.assign({}, params, {callback: cb, _: Date.now()});
    script.src = API + '?' + Object.keys(datos)
      .map(k => k + '=' + encodeURIComponent(datos[k])).join('&');
    document.body.appendChild(script);
    setTimeout(() => {
      if (terminado) return;
      terminado = true;
      limpiar();
      reject(new Error('Tiempo de espera agotado'));
    }, 10000);
  });
}

/* ───────────────────────── la cámara ───────────────────────── */
const video = $('#cam');
const lienzo = document.createElement('canvas');
const ctx = lienzo.getContext('2d', {willReadFrequently:true});
let detector = null;

/* Frontal por defecto: la pantalla mira al alumno mientras ficha. El botón de abajo
   a la derecha cambia a la trasera; la tablet se acuerda de la elección (Javier, 29 sept 2026). */
let modoCam = 'user';
try { if (localStorage.getItem('camara') === 'environment') modoCam = 'environment'; } catch(e){}
let flujo = null, bucle = false;

function pintarBotonCam(){
  $('#camBtn').textContent = modoCam === 'user' ? '📷 Cámara frontal' : '📷 Cámara trasera';
  video.classList.toggle('espejo', modoCam === 'user');
}
function cambiarCamara(){
  modoCam = modoCam === 'user' ? 'environment' : 'user';
  try { localStorage.setItem('camara', modoCam); } catch(e){}
  arrancarCamara();
}

async function arrancarCamara(){
  pintarBotonCam();
  if (flujo){ flujo.getTracks().forEach(t => t.stop()); flujo = null; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: modoCam, width:{ideal:1280}, height:{ideal:720} },
      audio: false
    });
    flujo = stream;
    video.srcObject = stream;
    await video.play();
    aviso.style.display = 'none';
  } catch(e){
    aviso.textContent = 'No puedo abrir la cámara. Toca la pantalla y da permiso.';
    aviso.style.display = 'block';
    document.body.onclick = () => { document.body.onclick = null; arrancarCamara(); };
    return;
  }
  if (bucle) return;            // al cambiar de cámara, el lector ya está en marcha
  bucle = true;
  if ('BarcodeDetector' in window){
    try { detector = new BarcodeDetector({formats:['qr_code']}); } catch(e){ detector = null; }
  }
  if (!detector) await cargarJsQR();
  requestAnimationFrame(mirar);
}

function cargarJsQR(){
  return new Promise(res => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';
    s.onload = res; s.onerror = res;
    document.head.appendChild(s);
  });
}

async function mirar(){
  if (!ocupado && video.readyState === 4){
    let texto = null;
    if (detector){
      try {
        const cods = await detector.detect(video);
        if (cods && cods.length) texto = cods[0].rawValue;
      } catch(e){}
    } else if (window.jsQR){
      const w = 480, h = Math.round(video.videoHeight / video.videoWidth * 480) || 360;
      lienzo.width = w; lienzo.height = h;
      ctx.drawImage(video, 0, 0, w, h);
      const img = ctx.getImageData(0, 0, w, h);
      const q = jsQR(img.data, w, h, {inversionAttempts:'dontInvert'});
      if (q && q.data) texto = q.data;
    }
    if (texto){
      const ahora = Date.now();
      if (texto !== ultimo || ahora - ultimoT > RELECTURA){
        ultimo = texto; ultimoT = ahora;
        if (navigator.vibrate) navigator.vibrate(60);
        fichar(texto);
      }
    }
  }
  requestAnimationFrame(mirar);
}

arrancarCamara();
