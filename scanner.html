<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F3A4D">
<title>Fichaje — Academia Logaritmo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0F3A4D;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#fff;user-select:none}
  /* cámara FRONTAL (29 sept 2026): se ve en espejo (.espejo), como un selfi, para que el
     alumno sepa hacia dónde mover el carné. El lector no se entera del espejo. */
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #cam.espejo{transform:scaleX(-1)}
  #velo{position:fixed;inset:0;background:linear-gradient(180deg,rgba(15,58,77,.55),rgba(15,58,77,.85))}

  .marco{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(62vw,62vh);aspect-ratio:1;border-radius:28px;
    box-shadow:0 0 0 9999px rgba(15,58,77,.55);border:3px solid rgba(255,255,255,.35)}
  .marco i{position:absolute;width:38px;height:38px;border:5px solid #E9A93A}
  .marco i:nth-child(1){top:-3px;left:-3px;border-right:0;border-bottom:0;border-radius:24px 0 0 0}
  .marco i:nth-child(2){top:-3px;right:-3px;border-left:0;border-bottom:0;border-radius:0 24px 0 0}
  .marco i:nth-child(3){bottom:-3px;left:-3px;border-right:0;border-top:0;border-radius:0 0 0 24px}
  .marco i:nth-child(4){bottom:-3px;right:-3px;border-left:0;border-top:0;border-radius:0 0 24px 0}

  #reposo{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;padding:5vh 4vw;pointer-events:none}
  #reposo h1{font-size:clamp(22px,4.4vw,44px);font-weight:800;letter-spacing:-.5px;text-align:center}
  #reposo p{font-size:clamp(15px,2.4vw,24px);opacity:.85;text-align:center;max-width:22ch}
  /* cabecera (29 sept 2026): logotipo + «Punto de fichaje» */
  .cabecera{display:flex;flex-direction:column;align-items:center;gap:.8vh;margin-top:-2vh}
  .cabecera img{height:clamp(40px,7vh,80px);width:auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,.35))}
  .cabecera span{font-size:clamp(11px,1.6vw,15px);font-weight:800;letter-spacing:.32em;text-transform:uppercase;
    color:#E9A93A;padding:4px 14px;border:1.5px solid rgba(233,169,58,.55);border-radius:99px;background:rgba(15,58,77,.55)}
  .pieReposo{display:flex;flex-direction:column;align-items:center;gap:.6vh}
  /* botón para cambiar de cámara: discreto, abajo a la derecha */
  #camBtn{position:fixed;right:2.5vw;bottom:3vh;z-index:4;font:inherit;font-size:clamp(13px,1.7vw,17px);font-weight:700;
    padding:10px 16px;min-width:0;border-radius:99px;border:1.5px solid rgba(255,255,255,.3);
    background:rgba(15,58,77,.7);color:#fff;cursor:pointer}
  .reloj{font-size:clamp(30px,6vw,64px);font-weight:800;color:#E9A93A;line-height:1}
  .fecha{font-size:clamp(13px,2vw,20px);opacity:.7;text-transform:capitalize}

  /* ---- pantallas de encima ---- */
  #panel{position:fixed;inset:0;background:#0F3A4D;display:none;
    flex-direction:column;align-items:center;justify-content:center;
    padding:6vh 6vw;text-align:center;gap:3vh;z-index:5}
  #panel.on{display:flex}
  #panel.verde{background:#0E4A3C}
  #panel.ambar{background:#5C420B}
  .icono{font-size:clamp(52px,11vw,104px);line-height:1}
  .titulo{font-size:clamp(28px,6.4vw,64px);font-weight:800;letter-spacing:-1px;line-height:1.05}
  .texto{font-size:clamp(17px,3.2vw,32px);line-height:1.4;max-width:26ch;opacity:.95}
  .pie{position:fixed;left:0;right:0;bottom:3vh;font-size:clamp(12px,1.8vw,18px);opacity:.5}

  .ops{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:1vh}
  button{font:inherit;font-weight:700;font-size:clamp(17px,3vw,28px);
    padding:18px 30px;min-width:150px;border:0;border-radius:18px;
    background:#E9A93A;color:#20160A;cursor:pointer}
  button.sec{background:rgba(255,255,255,.16);color:#fff}
  button:active{transform:scale(.97)}
  input[type=text]{font:inherit;font-size:clamp(18px,3vw,28px);padding:16px 20px;
    border-radius:16px;border:2px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.1);color:#fff;width:min(80vw,560px);text-align:center}
  .barra{height:7px;width:min(70vw,520px);border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
  .barra span{display:block;height:100%;width:100%;background:#E9A93A;transform-origin:left}
  .spin{width:54px;height:54px;border:6px solid rgba(255,255,255,.22);
    border-top-color:#E9A93A;border-radius:50%;animation:g .9s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  /* la mesa que le toca (29 sept 2026): lo más grande de la pantalla */
  .mesa{background:rgba(0,0,0,.22);border:3px solid #E9A93A;border-radius:24px;
    padding:2.2vh 5vw;line-height:1.05}
  .mesa small{display:block;font-size:clamp(15px,2.4vw,24px);font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:#E9A93A;margin-bottom:.6vh}
  .mesa b{display:block;font-size:clamp(40px,9vw,92px);font-weight:800;letter-spacing:-1px}
  .mesa i{font-style:normal;font-size:clamp(20px,3.6vw,38px);font-weight:700;opacity:.75}
  .sinmesa{background:#5C420B;border-radius:16px;padding:1.6vh 4vw;
    font-size:clamp(17px,3vw,28px);font-weight:700}
  /* plano del aula al lado (29 sept 2026): su mesa encendida y «AQUÍ» */
  .dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:4vw;align-items:center;width:100%;height:100%}
  .izq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6vh;min-width:0}
  .der{display:flex;align-items:center;justify-content:center;min-width:0;height:100%}
  .der svg{width:100%;height:auto;max-height:88vh}
  .dos .titulo{font-size:clamp(26px,4.6vw,56px)}
  .dos .texto{font-size:clamp(15px,2.3vw,26px)}
  .dos .mesa b{font-size:clamp(36px,6.4vw,80px)}
  @media (orientation:portrait){
    .dos{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:2vh}
    .der svg{max-height:44vh}
  }
  .pl-desk .top{fill:#e39a45;stroke:#ffd382;stroke-width:1.4}
  .pl-desk text{fill:#3a2206;font-size:8.6px;font-weight:900;text-anchor:middle;letter-spacing:-.01em;font-family:inherit}
  .pl-desk{opacity:.5}
  .pl-desk.suya{opacity:1}
  .pl-desk.suya .top{fill:#74efff;stroke:#e6ffff;stroke-width:2.4}
  .pl-desk.suya text{fill:#042438}
  .pl-halo{fill:none;stroke:#5bf0ff;stroke-width:4;animation:latido 1.6s ease-in-out infinite}
  @keyframes latido{50%{opacity:.35;stroke-width:9}}
  .pl-aqui{animation:bota 1.1s ease-in-out infinite}
  @keyframes bota{50%{transform:translateY(-6px)}}
  #aviso{position:fixed;top:0;left:0;right:0;background:#B3261E;color:#fff;
    padding:12px;text-align:center;font-size:15px;font-weight:700;display:none;z-index:9}
</style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>
<div id="velo"></div>
<div class="marco"><i></i><i></i><i></i><i></i></div>

<div id="reposo">
  <div class="cabecera">
    <img src="logo.png" alt="Academia Logaritmo" onerror="this.style.display='none'">
    <span>Punto de fichaje</span>
  </div>
  <div><h1>Acerca tu carné</h1><p>Ponlo dentro del recuadro. Se lee solo.</p></div>
  <div class="pieReposo"><div class="reloj" id="reloj">--:--</div><div class="fecha" id="fecha"></div></div>
</div>
<button id="camBtn" type="button" onclick="cambiarCamara()">📷 Cámara frontal</button>

<div id="panel"></div>
<div id="aviso"></div>

<script>
/* ─────────────────────────────────────────────────────────────
   CONFIGURACIÓN — lo único que hay que tocar
   Pega aquí la URL /exec de la aplicación web del FICHAJE.
   (Apps Script → Implementar → Nueva implementación → Aplicación web,
    ejecutar como TÚ, con acceso "Cualquier persona".)
   29 sept 2026: al fichar la entrada enseña en grande la mesa que le ha
   tocado («Tu mesa: Newton · M11»). La sortea el Codigo.gs del fichaje.
   ───────────────────────────────────────────────────────────── */
const API = 'https://script.google.com/macros/s/AKfycbxLbfrRn5U4dxrv2pc7D8tM6a09sK4Fg2ZDy8aKWwmiQUJCfLwIG29anCY22S8HDEMG/exec';

const CIERRE       = '20:30'; // la academia cierra a esta hora: ninguna opción pasa de aquí
const ESPERA_FINAL = 10;   // segundos que se queda el mensaje antes de volver a la cámara
const RELECTURA    = 4000; // ms de bloqueo tras leer, para no leer dos veces

/* ───────────────────────── estado ───────────────────────── */
const $ = s => document.querySelector(s);
const panel = $('#panel'), reposo = $('#reposo'), aviso = $('#aviso');
let ocupado = false, ultimo = '', ultimoT = 0, temporizador = null;
let planoActual = '';   // el plano con su mesa: acompaña a todas las pantallas de la entrada

/* ───────────────────────── reloj ───────────────────────── */
function reloj(){
  const d = new Date();
  $('#reloj').textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  $('#fecha').textContent = d.toLocaleDateString('es-ES',
    {weekday:'long', day:'numeric', month:'long'});
}
reloj(); setInterval(reloj, 10000);

/* ─────────────── que la tablet no se apague ─────────────── */
let wl = null;
async function despierta(){
  try { if ('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); } catch(e){}
}
despierta();
document.addEventListener('visibilitychange', () => { if (!document.hidden) despierta(); });

/* ───────────────────────── pantallas ───────────────────────── */
function mostrar(html, clase){
  panel.className = 'on' + (clase ? ' ' + clase : '');
  panel.innerHTML = planoActual
    ? '<div class="dos"><div class="izq">' + html + '</div><div class="der">' + planoActual + '</div></div>'
    : html;
}
function ocultar(){
  panel.className = '';
  panel.innerHTML = '';
  planoActual = '';
  ocupado = false;
}

/* ─────────────── el plano del aula (29 sept 2026) ───────────────
   Para que el alumno encuentre su mesa nada más fichar. No sirve para nada más.
   Dibujo: vista cenital, entrada abajo (diseño de GPT que eligió Javier).
   SITIO = centro de cada mesa por su número. Si una mesa cambia de sitio, se cambia aquí.
   Los nombres NO van aquí: llegan de la pestaña «Mesas» con cada fichaje. */
const SITIO = {
   8:[315,125],  7:[370,125],                               // arriba izquierda: Galileo, Lovelace
  24:[453,129], 23:[507,129],                               // tarima del piano: Czerny, Liszt
  11:[469,244],  3:[531,244],                               // tarima central, fila 1: Newton, Hipatia
   2:[469,293], 10:[531,293],                               //                 fila 2: Arquímedes, Einstein
   4:[469,395], 17:[531,395],                               //                 fila 3: Euler, Monge
   6:[469,444], 13:[531,444],                               //                 fila 4: Noether, Curie
  15:[314,360], 14:[314,445], 16:[314,530],                 // pared izquierda: Lavoisier, Mendeléiev, Franklin
  12:[691,194], 22:[691,279], 20:[691,364],                 // derecha, de arriba abajo: Faraday, Austen, Pardo Bazán,
  21:[691,449], 19:[691,534], 18:[691,619],                 //   Shakespeare, Cervantes, Leonardo
   5:[404,659],  9:[500,659],  1:[596,659]                  // abajo: Gauss, Kepler, Pitágoras
};
const AULA_SVG = `
  <defs>
    <pattern id="pw" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#a56c34"/><path d="M3 0V14M11 0V14" stroke="#d9954f" stroke-width=".7" opacity=".35"/></pattern>
    <filter id="pg" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="226" y="18" width="548" height="704" rx="14" fill="#24506c" stroke="#8bacc5" stroke-width="2"/>
  <rect x="242" y="31" width="516" height="675" fill="#07233a" stroke="#20445b" stroke-width="2"/>
  <rect x="375" y="704" width="250" height="24" fill="#0F3A4D"/>
  <path d="M227 18H385M615 18H774M227 18V720H376M774 18V720H624" fill="none" stroke="#a7bfd3" stroke-width="4" stroke-linejoin="round"/>
  <text x="500" y="748" fill="#51e9f6" font-size="15" font-weight="800" letter-spacing="4" text-anchor="middle">ENTRADA</text>
  <rect x="412" y="4" width="176" height="26" rx="6" fill="#142d38" stroke="#cc9f51"/>
  <text x="500" y="22" fill="#efbd6a" font-size="13" font-weight="700" letter-spacing="3" text-anchor="middle">PIZARRA</text>
  <rect x="437" y="42" width="126" height="58" rx="5" fill="#071b2b" stroke="#5a7d91" stroke-width="2"/>
  <text x="500" y="76" fill="#c6e9f5" font-size="12" letter-spacing="3" text-anchor="middle">PIANO</text>
  <rect x="278" y="80" width="72" height="143" fill="url(#pw)" stroke="#e0a160" stroke-width="1.5"/>
  <rect x="408" y="92" width="142" height="92" fill="url(#pw)" stroke="#ffcf86" stroke-width="2"/>
  <rect x="277" y="235" width="72" height="402" fill="url(#pw)" stroke="#d99a55" stroke-width="1.5"/>
  <rect x="655" y="170" width="73" height="465" fill="url(#pw)" stroke="#d99a55" stroke-width="1.5"/>
  <rect x="424" y="216" width="151" height="323" fill="url(#pw)" stroke="#e8a762" stroke-width="2"/>
  <rect x="357" y="623" width="286" height="82" fill="url(#pw)" stroke="#e8a762" stroke-width="2"/>
  <rect x="596" y="44" width="46" height="60" rx="2" fill="#a4b9b7" stroke="#d1edec"/>`;

function planoSVG(suya, mesas){
  const nombres = {};
  (mesas || []).forEach(m => { nombres[m[0]] = m[1]; });
  if (!nombres[suya.n]) nombres[suya.n] = suya.nombre;
  let d = '', marca = '';
  Object.keys(SITIO).forEach(k => {
    const n = +k, p = SITIO[k], es = n === suya.n;
    const nom = String(nombres[n] || ('M' + n)), partes = nom.split(' ');
    const lin = partes.length > 1 ? [partes.slice(0,-1).join(' '), partes[partes.length-1]] : [nom];
    const txt = lin.map((t,i) => '<text y="' + (lin.length > 1 ? -1 + i*9 : 4) + '"' +
                 (t.length > 8 ? ' textLength="46" lengthAdjust="spacingAndGlyphs"' : '') + '>' + escapar(t) + '</text>').join('');
    d += '<g class="pl-desk' + (es ? ' suya' : '') + '" transform="translate(' + p[0] + ' ' + p[1] + ')">' +
         (es ? '<rect class="pl-halo" x="-34" y="-30" width="68" height="60" rx="12" filter="url(#pg)"/>' : '') +
         '<rect class="top" x="-25" y="-22" width="50" height="42" rx="5"/>' + txt + '</g>';
    if (es) marca = '<g transform="translate(' + p[0] + ' ' + (p[1] - 24) + ')"><g class="pl-aqui" filter="url(#pg)">' +
         '<rect x="-38" y="-62" width="76" height="32" rx="16" fill="#68eeff"/>' +
         '<text y="-40" text-anchor="middle" font-size="15" font-weight="900" letter-spacing="2" fill="#052838">AQUÍ</text>' +
         '<path d="M-9 -26 0 -14 9 -26" fill="#7cf3ff"/></g></g>';
  });
  return '<svg viewBox="215 0 570 760" role="img" aria-label="Plano del aula: tu mesa">' + AULA_SVG + d + marca + '</svg>';
}

function pantallaLeyendo(){
  mostrar('<div class="spin"></div>' +
          '<div class="titulo">Carné leído</div>' +
          '<div class="texto">Ya puedes retirar el móvil. Un momento…</div>');
}

function pantallaError(msg){
  mostrar('<div class="icono">😕</div>' +
          '<div class="titulo">Vaya</div>' +
          '<div class="texto">' + msg + '</div>' +
          '<div class="ops"><button onclick="ocultar()">Volver</button></div>', 'ambar');
  setTimeout(() => { if (panel.className.includes('on')) ocultar(); }, 8000);
}

/* «Tu mesa: Newton (M11)» en grande. Si no quedaba ninguna libre, el aviso. */
function htmlMesa(r){
  if (r && r.mesa && r.mesa.nombre){
    return '<div class="mesa"><small>Tu mesa</small><b>' + escapar(r.mesa.nombre) + '</b>' +
           '<i>M' + escapar(r.mesa.n) + '</i></div>';
  }
  if (r && r.mesaAviso) return '<div class="sinmesa">⚠️ ' + escapar(r.mesaAviso) + '</div>';
  return '';
}

/** Pantalla final: se queda un buen rato y vuelve sola a la cámara. */
function pantallaFinal(icono, titulo, texto, clase, segundos, mesa){
  const s = segundos || ESPERA_FINAL;
  mostrar('<div class="icono">' + icono + '</div>' +
          '<div class="titulo">' + titulo + '</div>' +
          (mesa || '') +
          '<div class="texto">' + texto + '</div>' +
          '<div class="barra"><span id="bar"></span></div>' +
          '<div class="ops"><button class="sec" onclick="ocultar()">Listo</button></div>', clase);
  const bar = $('#bar');
  if (bar){
    bar.animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}],
                {duration: s*1000, fill:'forwards', easing:'linear'});
  }
  clearTimeout(temporizador);
  temporizador = setTimeout(ocultar, s*1000);
}

/* ───────────────────────── preguntas ───────────────────────── */
function preguntar(id, preg, despues){
  let ops = '';
  if (preg.opciones && preg.opciones.length){
    ops = preg.opciones.map((o,i) =>
      '<button data-r="'+i+'">'+escapar(o)+'</button>').join('');
  } else {
    ops = '<input type="text" id="libre" autocomplete="off" placeholder="Escribe aquí…">' +
          '<div class="ops" style="width:100%"><button data-r="libre">Enviar</button>' +
          '<button class="sec" data-r="salta">Ahora no</button></div>';
  }
  mostrar('<div class="icono">💬</div>' +
          '<div class="titulo" style="font-size:clamp(22px,4.4vw,42px)">' + escapar(preg.texto) + '</div>' +
          '<div class="ops">' + ops + '</div>' +
          (preg.opciones && preg.opciones.length
            ? '<div class="ops"><button class="sec" data-r="salta">Ahora no</button></div>' : ''));

  panel.querySelectorAll('button[data-r]').forEach(b => {
    b.onclick = () => {
      const v = b.dataset.r;
      let resp = null;
      if (v === 'salta') resp = null;
      else if (v === 'libre') resp = ($('#libre') || {}).value || '';
      else resp = preg.opciones[Number(v)];
      if (resp !== null && String(resp).trim()){
        llamar({accion:'responder', id:id, pregunta:preg.texto, respuesta:resp}).catch(()=>{});
      }
      despues();
    };
  });
}

/* ─────────── ¿hasta qué hora te quedas? (solo si no estaba apuntado) ─────────── */
/* Los 5 minutos para sentarse y sacar el material. No es una cuenta atrás con
   la que haya que quedarse mirando: dice la hora a la que empieza la clase y
   vuelve solo a la cámara. (Javier, 9 sept 2026.) */
function pantallaPrep(corto, arranque, margen, segundos, mesa){
  pantallaFinal('📚',
    corto ? '¡Vamos, ' + escapar(corto) + '!' : '¡Vamos!',
    'Tienes <b>' + margen + ' minutos</b> para sentarte y sacar los deberes y el material.' +
    '<br>La clase empieza a las <b>' + escapar(arranque) + '</b>.',
    'verde', segundos, mesa);
}

function preguntarSalida(id, despues, prevista){
  const ahora = new Date();
  // Ninguna opción pasa de la hora de cierre: a las 20:00, «una hora» son las 20:30.
  const cierreMin = (function(){ const c=CIERRE.split(':'); return (+c[0])*60 + (+c[1]); })();
  const vistos = {};
  // Si ya tiene hora de salida por su horario, va la primera para confirmarla (Javier, 17 sept 2026)
  let confirmar = '';
  if (prevista){
    vistos[prevista] = 1;
    confirmar = '<div class="ops"><button data-f="'+prevista+'" style="font-size:clamp(22px,3.6vw,36px);padding:.7em 1.6em;background:#2e9e6a;color:#fff">✓ Sí, hasta las '+prevista+'</button></div>';
  }
  const opciones = [60, 90, 120, 180].map(m => {
    const d = new Date(ahora.getTime() + m*60000);
    let mins = d.getHours()*60 + d.getMinutes();
    let recortada = false;
    if (mins > cierreMin){ mins = cierreMin; recortada = true; }
    const hm = String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
    if (vistos[hm]) return '';                 // dos opciones que caen en la misma hora: sobra una
    vistos[hm] = 1;
    const et = recortada ? 'Hasta cerrar' : (m < 60 ? m+' min' : (m/60) + (m===60 ? ' hora' : ' horas'));
    return '<button data-f="'+hm+'">'+et+'<br><small style="opacity:.65;font-weight:600">hasta '+hm+'</small></button>';
  }).join('');

  mostrar('<div class="icono">🕐</div>' +
          '<div class="titulo" style="font-size:clamp(24px,4.8vw,46px)">' +
            (prevista ? '¿Te quedas hasta las ' + prevista + '?' : '¿Hasta qué hora te quedas?') + '</div>' +
          confirmar +
          (prevista ? '<div class="texto" style="margin-top:.4em">Si no, elige:</div>' : '') +
          '<div class="ops">' + opciones + '</div>' +
          '<div class="ops"><button class="sec" data-f="">No lo sé</button></div>');

  panel.querySelectorAll('button[data-f]').forEach(b => {
    b.onclick = () => {
      if (b.dataset.f) llamar({accion:'salida', id:id, fin:b.dataset.f}).catch(()=>{});
      despues();
    };
  });
}

/* ───────────────────────── el flujo entero ───────────────────────── */
async function fichar(codigo){
  ocupado = true;
  planoActual = '';
  pantallaLeyendo();
  let r;
  try {
    r = await llamar({accion:'fichar', id:codigo});
  } catch(e){
    pantallaError('No hay conexión con la hoja. Díselo a Javier.');
    return;
  }
  if (!r || !r.ok){ pantallaError((r && r.error) || 'Algo ha fallado.'); return; }

  // Si le ha tocado mesa y sabemos dónde está, el plano le acompaña hasta que se sienta.
  planoActual = (r.mesa && SITIO[r.mesa.n]) ? planoSVG(r.mesa, r.mesas) : '';

  if (r.tipo === 'repetido'){
    pantallaFinal('👍', r.titulo, r.texto, 'verde', r.espera, htmlMesa(r)); return;
  }
  if (r.tipo === 'salida'){
    pantallaFinal('👋', r.titulo, r.texto, 'verde', r.espera); return;
  }

  // Entrada: saludo → (hora de salida) → (pregunta) → gracias
  const corto = (r.nombre || '').trim().split(/\s+/)[0] || '';
  const mesa = htmlMesa(r);   // se repite al final, que es lo que ve al irse a sentar
  const gracias = () => r.arranque
      ? pantallaPrep(corto, r.arranque, r.margen || 5, r.espera, mesa)
      : pantallaFinal('✅',
          corto ? '¡Gracias, ' + corto + '!' : '¡Gracias!',
          'Fichado a las ' + horaActual() + '. Buena clase 💪', 'verde', r.espera, mesa);

  const conPregunta = () => r.pregunta ? preguntar(r.id, r.pregunta, gracias) : gracias();
  const conSalida   = () => preguntarSalida(r.id, conPregunta, r.prevista || '');   // a todos (17 sept 2026)

  mostrar('<div class="icono">👋</div>' +
          '<div class="titulo">' + escapar(r.titulo) + '</div>' +
          mesa +
          '<div class="texto">' + escapar(r.texto) + '</div>' +
          '<div class="ops"><button id="seguir">Seguir</button></div>', 'verde');
  $('#seguir').onclick = conSalida;
  clearTimeout(temporizador);
  temporizador = setTimeout(conSalida, 5000);   // si no toca nada, sigue solo
}

function horaActual(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function escapar(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ───────────────────────── hablar con Apps Script ───────────────────────── */
function llamar(params){
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    const script = document.createElement('script');
    let terminado = false;
    const limpiar = () => {
      try { delete window[cb]; } catch(e) {}
      if (script.parentNode) script.parentNode.removeChild(script);
    };
    window[cb] = respuesta => {
      if (terminado) return;
      terminado = true;
      limpiar();
      resolve(respuesta);
    };
    script.onerror = () => {
      if (terminado) return;
      terminado = true;
      limpiar();
      reject(new Error('Sin conexión'));
    };
    const datos = Object.assign({}, params, {callback: cb, _: Date.now()});
    script.src = API + '?' + Object.keys(datos)
      .map(k => k + '=' + encodeURIComponent(datos[k])).join('&');
    document.body.appendChild(script);
    setTimeout(() => {
      if (terminado) return;
      terminado = true;
      limpiar();
      reject(new Error('Tiempo de espera agotado'));
    }, 10000);
  });
}

/* ───────────────────────── la cámara ───────────────────────── */
const video = $('#cam');
const lienzo = document.createElement('canvas');
const ctx = lienzo.getContext('2d', {willReadFrequently:true});
let detector = null;

/* Frontal por defecto: la pantalla mira al alumno mientras ficha. El botón de abajo
   a la derecha cambia a la trasera; la tablet se acuerda de la elección (Javier, 29 sept 2026). */
let modoCam = 'user';
try { if (localStorage.getItem('camara') === 'environment') modoCam = 'environment'; } catch(e){}
let flujo = null, bucle = false;

function pintarBotonCam(){
  $('#camBtn').textContent = modoCam === 'user' ? '📷 Cámara frontal' : '📷 Cámara trasera';
  video.classList.toggle('espejo', modoCam === 'user');
}
function cambiarCamara(){
  modoCam = modoCam === 'user' ? 'environment' : 'user';
  try { localStorage.setItem('camara', modoCam); } catch(e){}
  arrancarCamara();
}

async function arrancarCamara(){
  pintarBotonCam();
  if (flujo){ flujo.getTracks().forEach(t => t.stop()); flujo = null; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: modoCam, width:{ideal:1280}, height:{ideal:720} },
      audio: false
    });
    flujo = stream;
    video.srcObject = stream;
    await video.play();
    aviso.style.display = 'none';
  } catch(e){
    aviso.textContent = 'No puedo abrir la cámara. Toca la pantalla y da permiso.';
    aviso.style.display = 'block';
    document.body.onclick = () => { document.body.onclick = null; arrancarCamara(); };
    return;
  }
  if (bucle) return;            // al cambiar de cámara, el lector ya está en marcha
  bucle = true;
  if ('BarcodeDetector' in window){
    try { detector = new BarcodeDetector({formats:['qr_code']}); } catch(e){ detector = null; }
  }
  if (!detector) await cargarJsQR();
  requestAnimationFrame(mirar);
}

function cargarJsQR(){
  return new Promise(res => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';
    s.onload = res; s.onerror = res;
    document.head.appendChild(s);
  });
}

async function mirar(){
  if (!ocupado && video.readyState === 4){
    let texto = null;
    if (detector){
      try {
        const cods = await detector.detect(video);
        if (cods && cods.length) texto = cods[0].rawValue;
      } catch(e){}
    } else if (window.jsQR){
      const w = 480, h = Math.round(video.videoHeight / video.videoWidth * 480) || 360;
      lienzo.width = w; lienzo.height = h;
      ctx.drawImage(video, 0, 0, w, h);
      const img = ctx.getImageData(0, 0, w, h);
      const q = jsQR(img.data, w, h, {inversionAttempts:'dontInvert'});
      if (q && q.data) texto = q.data;
    }
    if (texto){
      const ahora = Date.now();
      if (texto !== ultimo || ahora - ultimoT > RELECTURA){
        ultimo = texto; ultimoT = ahora;
        if (navigator.vibrate) navigator.vibrate(60);
        fichar(texto);
      }
    }
  }
  requestAnimationFrame(mirar);
}

arrancarCamara();
