<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fichaje · Academia logaRitmo</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root{ --teal:#0f3a4d; --teal2:#0c2e3d; --gold:#e9a93a; --gold-soft:#f3c876; --tx:#eaf2f5; --mut:#9fb6c0; }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:radial-gradient(120% 120% at 50% 0%, #14495f 0%, var(--teal) 55%, var(--teal2) 100%);
         color:var(--tx);text-align:center;}
    .logo{display:block;margin:0 auto;max-width:78vw;width:340px;height:auto}
    .hidden{display:none !important}
    #gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
    #gate .card{background:rgba(255,255,255,.05);border:1px solid rgba(233,169,58,.25);border-radius:20px;padding:28px 24px;max-width:380px;width:100%;backdrop-filter:blur(4px)}
    #gate input{padding:14px;font-size:1.1rem;border-radius:12px;border:1px solid #2c5366;width:100%;background:#0b2a38;color:var(--tx);text-align:center;margin-top:6px}
    #gate input::placeholder{color:#577}
    .btn{padding:14px 22px;font-size:1.1rem;border:none;border-radius:12px;cursor:pointer;background:var(--gold);color:#1a1205;font-weight:700;width:100%;margin-top:14px}
    .btn:active{transform:scale(.98)}
    #gateErr{color:#fca5a5;min-height:18px;margin-top:10px;font-size:.95rem}
    #app{padding:20px 16px}
    #app .hint{color:var(--mut);font-size:1.05rem;margin:14px 0 6px}
    #reader{width:340px;max-width:88vw;margin:14px auto 0;border-radius:16px;overflow:hidden;border:2px solid rgba(233,169,58,.35)}
    #reader img[alt="Info icon"], #reader__dashboard_section_csr span{display:none}
    .pie{color:#6f8b97;font-size:.8rem;margin-top:18px}
    #result{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:30px 22px;z-index:20}
    #result.show{display:flex}
    #result.entrada{background:linear-gradient(160deg,#15633f,#0f4730)}
    #result.salida{background:linear-gradient(160deg,#1d4ed8,#11317f)}
    #result.nohorario{background:linear-gradient(160deg,#b9791a,#8a5610)}
    #result.error{background:linear-gradient(160deg,#8a2b2b,#5e1b1b)}
    #result .logo{width:190px;opacity:.95;margin-bottom:8px}
    #r1{font-size:2.1rem;font-weight:800;line-height:1.15}
    #r2{font-size:1.25rem;margin-top:12px;opacity:.96}
    #r3{font-size:1.3rem;margin-top:10px;font-weight:700;color:#ffe7b3}
    #r4{font-size:1.15rem;margin-top:16px;opacity:.95;line-height:1.5;max-width:680px}
    #result .btn{max-width:320px;margin-top:30px;font-size:1.2rem;padding:18px 24px;background:#fff;color:#10242c}
    #estado{margin:16px auto 0;font-size:1.05rem;color:var(--gold-soft);min-height:24px}
  </style>
</head>

      window[cb] = function (res) { resuelto = true; mostrar(res); delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); };
      s.onerror = function () { if (resuelto) return; resuelto = true; mostrar({ tipo:'error', titulo:'⚠️ Sin conexión', linea2:'Revisa la URL del backend' }); };
      setTimeout(function () { if (resuelto) return; resuelto = true; mostrar({ tipo:'error', titulo:'⚠️ Sin respuesta', linea2:'El servidor no contestó' }); }, 8000);
      s.src = BACKEND_URL + '?id=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(CLAVE) + '&callback=' + cb;
      document.body.appendChild(s);
    }
    function mostrar(res) {
      if (!res.titulo) {
        if (res.tipo === 'entrada') res.titulo = '✅ Hola, ' + res.nombre;
        else if (res.tipo === 'salida') res.titulo = '👋 Hasta luego, ' + res.nombre;
        else res.titulo = '⚠️ ' + (res.mensaje || 'Error');
      }
      let clase = 'error';
      if (res.tipo === 'entrada') clase = 'entrada';
      else if (res.tipo === 'salida') clase = 'salida';
      else if (res.tipo === 'nohorario') clase = 'nohorario';
      document.getElementById('r1').innerHTML = res.titulo || '';
      document.getElementById('r2').innerHTML = res.linea2 || '';
      document.getElementById('r3').innerHTML = res.linea3 || '';
      document.getElementById('r4').innerHTML = res.linea4 || '';
      document.getElementById('btnResult').textContent = res.boton || '🔄 Nuevo fichaje';
      document.getElementById('result').className = 'show ' + clase;
    }
    function nuevoFichaje() {
      document.getElementById('result').className = '';
      document.getElementById('estado').textContent = 'Cámara encendida…';
      try { lector.resume(); } catch (e) {}
      ocupado = false;
    }
  </script>
</body>
</html>
